<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ziele &amp; OKRs</title>
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/ui.js"></script>
<style>
  main { max-width: 960px; }
  .toolbar button { min-height: 38px; }
  .sp { flex: 1; }
  .muted { color: var(--muted); }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }
  .tabs button.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .badge { display:inline-block; padding:1px 8px; border-radius:99px; font-size:.78rem; border:1px solid var(--line); background:var(--bg); }
  .badge.ok { color:var(--ok); border-color:var(--ok); } .badge.warn { color:var(--warn); border-color:var(--warn); } .badge.err { color:var(--err); border-color:var(--err); }
  button.small { padding:2px 9px; font-size:.85rem; }
  [hidden] { display:none !important; }

  main { max-width: 1000px; }
  .goal { padding:0; overflow:hidden; } .goal > summary { list-style:none; cursor:pointer; padding:12px 16px; display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; }
  .goal > summary::-webkit-details-marker { display:none; }
  .goal .body { padding:0 16px 14px; border-top:1px solid var(--line); }
  .goal h3 { margin:0; font-size:1.05rem; flex:1; min-width:160px; }
  .bar { height:10px; background:var(--bg); border:1px solid var(--line); border-radius:6px; overflow:hidden; min-width:90px; }
  .bar > i { display:block; height:100%; background:var(--accent); } .bar.ok > i { background:var(--ok); } .bar.warn > i { background:var(--warn); }
  .sumbar { width:140px; }
  .sec { margin:14px 0 4px; font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .kr { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding:5px 0; border-bottom:1px solid var(--line); }
  .kr .t { flex:1; min-width:150px; } .kr input[type=number] { width:6em; }
  .ms { display:flex; align-items:center; gap:8px; padding:3px 0; } .ms.done span { text-decoration:line-through; color:var(--muted); } .ms span { flex:1; }
  .form { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; }
  label.f { display:flex; flex-direction:column; font-size:.8rem; color:var(--muted); gap:2px; }
  .rate { display:flex; gap:4px; } .rate button.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .ci { font-size:.9rem; padding:2px 0; } .ci .muted { margin-right:6px; }

</style>
</head>
<body>
<main>
  <p><a href="../index.html">← Alle Tools</a></p>
  <h1>Ziele &amp; OKRs</h1>
  <div class="card toolbar">
    <button id="new">Neu</button>
    <button id="open">Öffnen…</button>
    <button id="save" class="primary">Speichern</button>
    <button id="saveas">Speichern unter…</button>
  </div>
  <div id="status"></div>

  <p class="muted" style="margin:-4px 0 8px">Teilt seine Datei mit dem <a href="rueckblick.html">Rückblick</a>.</p>
  <div class="card toolbar">
    <label>Zeitraum <select id="period"></select></label>
    <label><input type="checkbox" id="showdone"> Erledigte zeigen</label>
    <span class="sp"></span><button id="addbtn" class="primary">+ Neues Ziel</button>
  </div>
  <form id="gform" class="card form" hidden>
    <label class="f" style="flex:1;min-width:200px">Ziel<input type="text" id="gtitle" required placeholder="z. B. Halbmarathon laufen"></label>
    <label class="f">Zeitraum<input type="text" id="gperiod" list="periods" placeholder="2026" style="width:7em"></label>
    <datalist id="periods"></datalist>
    <label class="f">Bereich<select id="garea"></select></label>
    <label class="f">Frist<input type="date" id="gdl"></label>
    <label class="f" style="flex:1;min-width:200px">Warum ist mir das wichtig?<input type="text" id="gwhy"></label>
    <button class="primary">Anlegen</button><button type="button" id="gcancel">Abbrechen</button>
  </form>
  <div id="list"></div>

</main>
<script src="../shared/storage.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    if (k === 'class') e.className = props[k];
    else if (k === 'dataset') Object.assign(e.dataset, props[k]);
    else if (k.startsWith('on')) e[k] = props[k];
    else if (k === 'list' || k.includes('-') || k === 'role') e.setAttribute(k, props[k]);
    else e[k] = props[k];
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = (s) => s ? parseYmd(s).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
const eur = (n) => (n || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
function download(name, text, type) {
  const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: type || 'text/plain;charset=utf-8' })), download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = h('textarea', { value: text }); document.body.append(t); t.select(); try { document.execCommand('copy'); } catch {} t.remove(); }
  if (btn) { const o = btn.textContent; btn.textContent = 'Kopiert ✓'; setTimeout(() => btn.textContent = o, 1200); }
}
const store = SimpleStorage.create({
  name: 'ziele',
  defaults: () => ({ goals: [], journal: [] }),
  onChange: () => { normalize(); render(); },
  statusEl: $('status'),
});
$('new').onclick = () => store.new();
$('open').onclick = () => store.open();
$('save').onclick = () => store.save();
$('saveas').onclick = () => store.saveAs();

const AREAS = ['Karriere', 'Gesundheit', 'Finanzen', 'Beziehungen', 'Lernen', 'Persönlich'];
let openIds = new Set();
function normalize() {
  const d = store.data;
  if (!Array.isArray(d.goals)) d.goals = [];
  if (!Array.isArray(d.journal)) d.journal = [];
  d.goals.forEach((g) => { for (const k of ['krs', 'milestones', 'checkins']) if (!Array.isArray(g[k])) g[k] = []; });
}
const clamp = (x) => Math.max(0, Math.min(1, x));
const today0 = () => parseYmd(ymd(new Date()));
const krProg = (k) => (k.target === k.start ? (k.current === k.target ? 1 : 0) : clamp((k.current - k.start) / (k.target - k.start)));
function progress(g) {
  const parts = g.krs.map(krProg).concat(g.milestones.map((m) => (m.done ? 1 : 0)));
  return parts.length ? parts.reduce((a, b) => a + b, 0) / parts.length : 0;
}
function status(g) {
  const p = progress(g), has = g.krs.length + g.milestones.length > 0;
  if (has && p >= 1) return { key: 'done', text: 'Erreicht ✓', kind: 'ok' };
  if (g.deadline) {
    const t = today0(), s = parseYmd(g.created || ymd(new Date())), e = parseYmd(g.deadline);
    if (e < t) return { key: 'late', text: 'Frist verpasst', kind: 'err' };
    const el = clamp((t - s) / Math.max(1, e - s));
    return p >= el - 0.1 ? { key: 'on', text: 'Im Plan', kind: 'ok' } : { key: 'behind', text: 'Hinten dran', kind: 'warn' };
  }
  return { key: 'open', text: 'Läuft', kind: '' };
}
function lastCheckin(g) { return g.checkins.length ? g.checkins.map((c) => c.date).sort().pop() : null; }
function checkinDue(g) { const l = lastCheckin(g) || g.created; return !l || (today0() - parseYmd(l)) / 86400000 >= 7; }
function render() {
  const periods = [...new Set(store.data.goals.map((g) => g.period).filter(Boolean))].sort().reverse();
  const pv = $('period').value;
  $('period').replaceChildren(h('option', { value: '' }, 'Alle'), ...periods.map((p) => h('option', { value: p }, p)));
  $('period').value = periods.includes(pv) ? pv : '';
  $('periods').replaceChildren(...periods.map((p) => h('option', { value: p })));
  if (!$('garea').options.length) $('garea').replaceChildren(...AREAS.map((a) => h('option', { value: a }, a)));
  const list = store.data.goals.filter((g) => (!$('period').value || g.period === $('period').value) && ($('showdone').checked || status(g).key !== 'done'));
  $('list').replaceChildren(...(list.length ? list.map(goalCard) : [h('div', { class: 'card muted' }, store.data.goals.length ? 'Keine Ziele in dieser Auswahl.' : 'Noch keine Ziele. Lege oben dein erstes an und unterteile es in messbare Key Results und Meilensteine.')]));
}
function goalCard(g) {
  const p = progress(g), st = status(g), pct = Math.round(p * 100);
  const el = h('details', { class: 'card goal' });
  el.open = openIds.has(g.id); el.ontoggle = () => { if (el.open) openIds.add(g.id); else openIds.delete(g.id); };
  el.append(h('summary', {}, h('h3', {}, g.title), h('span', { class: 'badge' }, g.area || '–'), g.period ? h('span', { class: 'badge' }, g.period) : null,
    h('span', { class: 'badge ' + st.kind }, st.text), checkinDue(g) && st.key !== 'done' ? h('span', { class: 'badge warn', title: 'Seit 7 Tagen kein Check-in' }, '🗓 Check-in') : null,
    h('div', { class: 'bar sumbar' + (st.key === 'done' ? ' ok' : st.key === 'behind' || st.key === 'late' ? ' warn' : '') }, h('i', { style: 'width:' + pct + '%' })), h('strong', {}, pct + ' %')));
  const body = h('div', { class: 'body' });
  if (g.why) body.append(h('p', { class: 'muted', style: 'margin:8px 0 0' }, '„' + g.why + '“'));
  if (g.deadline) body.append(h('p', { class: 'muted', style: 'margin:4px 0 0' }, 'Frist: ' + fmtDate(g.deadline)));
  // Key Results
  body.append(h('div', { class: 'sec' }, 'Key Results'));
  g.krs.forEach((k) => {
    const cur = h('input', { type: 'number', step: 'any', value: k.current, 'aria-label': k.title + ' aktuell' });
    cur.onchange = () => { const n = parseFloat(cur.value); if (!isNaN(n)) { k.current = n; store.changed(); render(); } };
    body.append(h('div', { class: 'kr' }, h('span', { class: 't' }, k.title), cur, h('span', { class: 'muted' }, '/ ' + k.target + (k.unit ? ' ' + k.unit : '') + ' (Start ' + k.start + ')'),
      h('div', { class: 'bar' + (krProg(k) >= 1 ? ' ok' : ''), style: 'width:90px' }, h('i', { style: 'width:' + krProg(k) * 100 + '%' })),
      h('button', { class: 'small', title: 'Entfernen', onclick: () => { g.krs = g.krs.filter((x) => x !== k); store.changed(); render(); } }, '✕')));
  });
  const kt = h('input', { type: 'text', placeholder: 'Neues Key Result, z. B. Wöchentliche Laufkilometer', style: 'flex:1;min-width:180px', 'aria-label': 'Key Result' });
  const ks = h('input', { type: 'number', step: 'any', placeholder: 'Start', value: 0, style: 'width:5.5em', 'aria-label': 'Startwert' });
  const kg = h('input', { type: 'number', step: 'any', placeholder: 'Ziel', required: true, style: 'width:5.5em', 'aria-label': 'Zielwert' });
  const ku = h('input', { type: 'text', placeholder: 'Einheit', style: 'width:6em', 'aria-label': 'Einheit' });
  const kf = h('form', { class: 'row', style: 'margin-top:6px' }, kt, ks, kg, ku, h('button', {}, '+ KR'));
  kf.onsubmit = (e) => { e.preventDefault(); if (!kt.value.trim()) return; const s = parseFloat(ks.value) || 0; g.krs.push({ id: uid(), title: kt.value.trim(), start: s, current: s, target: parseFloat(kg.value), unit: ku.value.trim() }); openIds.add(g.id); store.changed(); render(); };
  body.append(kf);
  // Meilensteine
  body.append(h('div', { class: 'sec' }, 'Meilensteine'));
  g.milestones.forEach((m) => { const cb = h('input', { type: 'checkbox', checked: m.done, 'aria-label': m.text }); cb.onchange = () => { m.done = cb.checked; store.changed(); render(); };
    body.append(h('div', { class: 'ms' + (m.done ? ' done' : '') }, cb, h('span', {}, m.text), h('button', { class: 'small', title: 'Entfernen', onclick: () => { g.milestones = g.milestones.filter((x) => x !== m); store.changed(); render(); } }, '✕'))); });
  const mt = h('input', { type: 'text', placeholder: 'Neuer Meilenstein…', style: 'flex:1', 'aria-label': 'Meilenstein' });
  const mf = h('form', { class: 'row', style: 'margin-top:6px' }, mt, h('button', {}, '+'));
  mf.onsubmit = (e) => { e.preventDefault(); if (!mt.value.trim()) return; g.milestones.push({ id: uid(), text: mt.value.trim(), done: false }); openIds.add(g.id); store.changed(); render(); };
  body.append(mf);
  // Check-in
  body.append(h('div', { class: 'sec' }, 'Wöchentlicher Check-in'));
  let rating = 0;
  const rb = [1, 2, 3, 4, 5].map((n) => { const b = h('button', { type: 'button', title: 'Gefühlter Fortschritt: ' + n + ' von 5', 'aria-label': n + ' von 5' }, n); b.onclick = () => { rating = n; rb.forEach((x, i) => x.classList.toggle('on', i + 1 === n)); }; return b; });
  const cn = h('input', { type: 'text', placeholder: 'Wie lief die Woche für dieses Ziel? Was ist der nächste Schritt?', style: 'flex:1;min-width:200px', 'aria-label': 'Check-in Notiz' });
  const cf = h('form', { class: 'row' }, h('div', { class: 'rate' }, rb), cn, h('button', { class: 'primary' }, 'Speichern'));
  cf.onsubmit = (e) => { e.preventDefault(); if (!cn.value.trim() && !rating) return; g.checkins.push({ date: ymd(new Date()), note: cn.value.trim(), rating }); openIds.add(g.id); store.changed(); render(); };
  body.append(cf, ...g.checkins.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4).map((c) => h('div', { class: 'ci' }, h('span', { class: 'muted' }, fmtDate(c.date) + (c.rating ? ' · ' + '★'.repeat(c.rating) : '')), c.note)));
  body.append(h('div', { class: 'row', style: 'margin-top:14px' }, h('button', { class: 'small', onclick: () => { const t = prompt('Titel ändern:', g.title); if (t && t.trim()) { g.title = t.trim(); store.changed(); render(); } } }, 'Umbenennen'),
    h('button', { class: 'small', onclick: () => { if (confirm('Ziel „' + g.title + '“ löschen?')) { store.data.goals = store.data.goals.filter((x) => x !== g); store.changed(); render(); } } }, 'Ziel löschen')));
  el.append(body);
  return el;
}
$('addbtn').onclick = () => { $('gform').hidden = !$('gform').hidden; if (!$('gform').hidden) { $('gperiod').value = $('gperiod').value || String(new Date().getFullYear()); $('gtitle').focus(); } };
$('gcancel').onclick = () => { $('gform').hidden = true; };
$('gform').onsubmit = (e) => {
  e.preventDefault();
  const g = { id: uid(), title: $('gtitle').value.trim(), period: $('gperiod').value.trim(), area: $('garea').value, deadline: $('gdl').value, why: $('gwhy').value.trim(), created: ymd(new Date()), krs: [], milestones: [], checkins: [] };
  store.data.goals.push(g); openIds.add(g.id); $('gform').reset(); $('gform').hidden = true; store.changed(); render();
};
$('period').onchange = render; $('showdone').onchange = render;

{ // Neuzeichnen darf sich nicht selbst unterbrechen (Blur/Change-Ereignisse beim Ersetzen von Elementen)
  const inner = render; let busy = false, again = false;
  render = function () {
    if (busy) { again = true; return; }
    busy = true; try { inner(); } finally { busy = false; }
    if (again) { again = false; render(); }
  };
}
store.restore();
normalize();
render();
</script>
</body>
</html>
