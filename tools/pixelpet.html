<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket-Pet</title>
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/i18n.js"></script>
<script src="../shared/ui.js"></script>
<style>
  main { max-width: 960px; }
  .toolbar button { min-height: 38px; }
  .sp { flex: 1; }
  .muted { color: var(--muted); }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }
  .tabs button.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .badge { display:inline-block; padding:1px 8px; border-radius:99px; font-size:.78rem; border:1px solid var(--line); background:var(--bg); }
  .badge.ok { color:var(--ok); border-color:var(--ok); } .badge.warn { color:var(--warn); border-color:var(--warn); } .badge.err { color:var(--err); border-color:var(--err); }
  button.small { padding:2px 9px; font-size:.85rem; }
  [hidden] { display:none !important; }

  main { max-width: 760px; }
  h2 { margin: 0 0 8px; font-size: 1.1rem; }
  .petcard .top { display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; margin-bottom:8px; }
  .petcard .top h2 { margin:0; flex:1; min-width:6em; font-size:1.3rem; overflow-wrap:anywhere; }
  .scene { position:relative; height:200px; border-radius:14px; border:1px solid var(--line); overflow:hidden;
    background:linear-gradient(180deg,#bfe6ff 0%,#e8f6ff 62%,#a8d98a 62%,#8cc56e 100%); transition:filter .6s; }
  .scene.night { filter:brightness(.55) saturate(.8); }
  .scene .pw { position:absolute; left:50%; bottom:6px; width:170px; height:170px; margin-left:-85px; transform-origin:50% 95%; }
  .scene .pw svg { width:100%; height:100%; overflow:visible; display:block; }
  .pw.idle, .pw.glad { animation:bob 1.6s ease-in-out infinite; }
  .pw.happy { animation:hop .5s ease-in-out infinite; }
  .pw.sleep { animation:breathe 3.2s ease-in-out infinite; }
  .pw.sad { animation:sway 2.4s ease-in-out infinite; }
  .pw.sick { animation:shiver .35s linear infinite; }
  .pw.faint { transform-origin:50% 50%; transform:translateY(34px) rotate(80deg); }
  .pw.egg { animation:wobble 2.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform:translateY(0) scale(1,1); } 50% { transform:translateY(-6px) scale(.98,1.03); } }
  @keyframes hop { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-26px); } }
  @keyframes breathe { 0%,100% { transform:scale(1,1); } 50% { transform:scale(1.02,.97); } }
  @keyframes sway { 0%,100% { transform:rotate(-2deg); } 50% { transform:rotate(2deg); } }
  @keyframes shiver { 0%,100% { transform:translateX(-1.5px); } 50% { transform:translateX(1.5px); } }
  @keyframes wobble { 0%,100% { transform:rotate(-5deg); } 50% { transform:rotate(5deg); } }
  .blink { transform-box:fill-box; transform-origin:center; animation:blink 4.5s infinite; }
  @keyframes blink { 0%,94%,100% { transform:scaleY(1); } 97% { transform:scaleY(.1); } }
  .scene .fx { position:absolute; font-size:1.7rem; pointer-events:none; }
  .scene .zzz { right:26%; top:14%; animation:float 2.4s ease-in-out infinite; }
  .scene .bubble { right:24%; top:12%; animation:float 2s ease-in-out infinite; }
  .scene .heart { top:30%; animation:rise 1.6s ease-out infinite; opacity:0; }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
  @keyframes rise { 0% { transform:translateY(30px); opacity:0; } 30% { opacity:1; } 100% { transform:translateY(-50px); opacity:0; } }
  .scene button.poop { position:absolute; bottom:8px; background:none; border:0; padding:2px; font-size:1.7rem; line-height:1; cursor:pointer; min-height:0; }
  .scene .toy { position:absolute; bottom:10px; left:12%; font-size:2rem; }
  .speech { min-height:2.6em; margin:8px 0; padding:7px 12px; border-radius:12px; background:var(--bg); border:1px solid var(--line); font-weight:600; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:6px 18px; margin:8px 0 12px; }
  .st { display:flex; align-items:center; gap:8px; font-size:.9rem; }
  .st .lab { width:6.6em; flex:none; }
  .bar { flex:1; height:12px; background:var(--bg); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--ok); transition:width .4s; }
  .bar.warn > i { background:var(--warn); } .bar.err > i { background:var(--err); }
  .st .val { width:3.2em; text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  .hearts { flex:1; letter-spacing:2px; }
  .acts { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; }
  .acts button { display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; min-height:62px; line-height:1.15; text-align:center; }
  .acts button .ic { font-size:1.5rem; }
  .species { display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:8px; margin:10px 0; }
  .species button { display:flex; flex-direction:column; align-items:center; padding:6px 4px; gap:2px; }
  .species button[aria-pressed=true] { border-color:var(--accent); outline:2px solid var(--accent); }
  .species svg { width:78px; height:78px; }
  .gcanvas { display:block; width:100%; max-width:420px; aspect-ratio:300/330; margin:8px auto; border:1px solid var(--line); border-radius:12px; touch-action:none; background:var(--bg); }
  .gcanvas:focus-visible { outline:2px solid var(--accent); }
  .ghud { gap:6px 16px; }
  .gmsg { min-height:2.4em; }
  .bignum { font-size:3.2rem; font-weight:700; text-align:center; padding:10px; border:1px solid var(--line); border-radius:12px; background:var(--bg); margin:8px 0; }
  .shop .it { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; padding:5px 0; border-top:1px solid var(--line); }
  .shop .it .ic { font-size:1.5rem; } .shop .it .nm { flex:1; min-width:7em; }
  .hall .e, .log .e { display:flex; flex-wrap:wrap; gap:2px 10px; align-items:baseline; padding:4px 0; border-top:1px solid var(--line); }
  .log .e .tm { color:var(--muted); font-variant-numeric:tabular-nums; font-size:.82rem; }
  .memorial { text-align:center; }
  .memorial svg { width:120px; height:120px; }
  .setrow { display:flex; flex-direction:column; gap:2px; margin:8px 0; }
  @media (prefers-reduced-motion: reduce) { .pw, .blink, .fx, .bar > i { animation:none !important; transition:none !important; } }
  @media (max-width:480px) { .scene { height:180px; } .scene .pw { width:150px; height:150px; margin-left:-75px; } .st .lab { width:5.6em; } }

</style>
</head>
<body>
<main>
  <p><a href="../index.html">← Alle Tools</a></p>
  <h1>Pocket-Pet</h1>
  <div class="card toolbar">
    <button id="new">Neu</button>
    <button id="open">Öffnen…</button>
    <button id="save" class="primary">Speichern</button>
    <button id="saveas">Speichern unter…</button>
  </div>
  <div id="status"></div>

  <p class="muted" style="margin:-4px 0 8px">Teilt seine Datei mit den anderen Spielen – Stand und Highscores werden gemeinsam gespeichert. <a href="minigolf.html">Minigolf</a> · <a href="blockfall.html">Blockfall</a></p>
  <div id="top"></div>
  <div id="gamebox" class="card" hidden></div>
  <div id="rest"></div>

</main>
<script src="../shared/storage.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    if (k === 'class') e.className = props[k];
    else if (k === 'dataset') Object.assign(e.dataset, props[k]);
    else if (k.startsWith('on')) e[k] = props[k];
    else if (k === 'list' || k.includes('-') || k === 'role') e.setAttribute(k, props[k]);
    else e[k] = props[k];
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = (s) => s ? parseYmd(s).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
const eur = (n) => (n || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
function download(name, text, type) {
  const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: type || 'text/plain;charset=utf-8' })), download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = h('textarea', { value: text }); document.body.append(t); t.select(); try { document.execCommand('copy'); } catch {} t.remove(); }
  if (btn) { const o = btn.textContent; btn.textContent = 'Kopiert ✓'; setTimeout(() => btn.textContent = o, 1200); }
}
const store = SimpleStorage.create({
  name: 'spiele',
  defaults: () => ({ pet: { v: 1 } }),
  onChange: () => { normalize(); render(); },
  statusEl: $('status'),
});
$('new').onclick = () => store.new();
$('open').onclick = () => store.open();
$('save').onclick = () => store.save();
$('saveas').onclick = () => store.saveAs();

/* ===== Daten ===== */
const SPECIES = [
  { k: 'cat', name: 'Katze', emoji: '🐱', c: '#f4a259', d: '#b86a1e', b: '#ffe6c7', def: 'Mimi' },
  { k: 'dog', name: 'Hund', emoji: '🐶', c: '#cf9b66', d: '#7a4b26', b: '#f6e0c4', def: 'Bello' },
  { k: 'bun', name: 'Hase', emoji: '🐰', c: '#ecebf3', d: '#9c98b4', b: '#ffffff', def: 'Hoppel' },
  { k: 'chick', name: 'Küken', emoji: '🐤', c: '#ffd84a', d: '#c79200', b: '#fff3b0', def: 'Piepsi' },
  { k: 'dra', name: 'Drache', emoji: '🐲', c: '#6fcf97', d: '#2f8a58', b: '#eef8b0', def: 'Funke' },
];
const STAGES = ['Ei', 'Baby', 'Kind', 'Teenager', 'Erwachsen', 'Senior'];
const AGE_AT = [0, 5, 1440, 4320, 7200, 17280];   // Minuten: Baby ab 5 Min., Kind ab Tag 1, Teen ab Tag 3, Erwachsen ab Tag 5, Senior ab Tag 12
const OLD_AGE = 43200;                           // 30 Tage (nur ohne Gnädigen Modus)
const OFFLINE_CAP = 480;                         // max. 8 Stunden Aufholen
const HATS = [{ id: 'bow', icon: '🎀', name: 'Schleife', price: 20 }, { id: 'cap', icon: '🧢', name: 'Kappe', price: 25 }, { id: 'top', icon: '🎩', name: 'Zylinder', price: 40 }, { id: 'crown', icon: '👑', name: 'Krone', price: 80 }];
const TOYS = [{ id: 'ball', icon: '⚽', name: 'Ball', price: 30 }, { id: 'teddy', icon: '🧸', name: 'Teddy', price: 45 }, { id: 'yoyo', icon: '🪀', name: 'Jo-Jo', price: 60 }];
const STAT_ROWS = [['hunger', '🍖', 'Sattheit'], ['fun', '🎈', 'Spaß'], ['energy', '⚡', 'Energie'], ['hygiene', '🧼', 'Sauberkeit']];
const URLSEED = (() => { const s = new URLSearchParams(location.search).get('seed'); return s != null && s !== '' ? (parseInt(s, 10) >>> 0) || 1 : null; })();

let skew = 0;                                    // Test: verschiebt die Uhr
const now = () => Date.now() + skew;
const D = () => store.data.pet;
const C = () => D().cur;
const num = (v, lo, hi, def) => { v = Number(v); return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : def; };
const clamp = (v) => Math.min(100, Math.max(0, v));
let flashMsg = '', flashUntil = 0, react = null, shopOpen = false, pick = 0, nameDraft = '';
let dirty = false, lastSave = 0;

function newCur(sp, name) {
  const t = now();
  return { species: sp, name: name, born: t, lastTick: t, stage: 0, asleep: false, sick: false, dead: false, how: '',
    hunger: 80, fun: 70, energy: 90, hygiene: 90, health: 100, poop: 0, poopP: 0, weight: 50, stuff: 0,
    careSum: 0, careN: 0, forms: {}, hat: '', toy: '', w: {}, cuddles: 0, seed: (URLSEED != null ? URLSEED : Math.floor(Math.random() * 4294967295)) >>> 0 };
}
function normalize() {
  const d = store.data;
  if (!d.pet || typeof d.pet !== 'object' || Array.isArray(d.pet)) d.pet = {};
  const p = d.pet;
  p.v = 1;
  if (!p.settings || typeof p.settings !== 'object' || Array.isArray(p.settings)) p.settings = {};
  p.settings.sound = p.settings.sound !== false;
  p.settings.mercy = p.settings.mercy !== false;
  p.coins = Math.floor(num(p.coins, 0, 1e7, 20));
  if (!p.best || typeof p.best !== 'object') p.best = {};
  p.best.catch = Math.floor(num(p.best.catch, 0, 1e6, 0)); p.best.hilo = Math.floor(num(p.best.hilo, 0, 1e6, 0));
  if (!p.owned || typeof p.owned !== 'object' || Array.isArray(p.owned)) p.owned = {};
  p.hall = (Array.isArray(p.hall) ? p.hall : []).filter((e) => e && typeof e === 'object').map((e) => ({ name: String(e.name || '').slice(0, 16), species: String(e.species || ''), days: Math.floor(num(e.days, 0, 1e5, 0)), stage: String(e.stage || ''), how: ['tot', 'alt', 'abgegeben'].includes(e.how) ? e.how : 'tot', t: num(e.t, 0, 1e15, 0) }));
  p.log = (Array.isArray(p.log) ? p.log : []).filter((e) => e && typeof e.m === 'string').slice(0, 10).map((e) => ({ t: num(e.t, 0, 1e15, 0), m: e.m }));
  if (p.cur && typeof p.cur === 'object' && !Array.isArray(p.cur)) {
    const c = p.cur, t = now();
    c.species = Math.floor(num(c.species, 0, SPECIES.length - 1, 0));
    c.name = String(c.name || SPECIES[c.species].def).slice(0, 16);
    c.born = num(c.born, 0, 1e15, t); c.lastTick = num(c.lastTick, 0, 1e15, t);
    c.stage = Math.floor(num(c.stage, 0, 5, 0));
    c.asleep = !!c.asleep; c.sick = !!c.sick; c.dead = !!c.dead; c.how = String(c.how || '');
    c.hunger = num(c.hunger, 0, 100, 80); c.fun = num(c.fun, 0, 100, 70); c.energy = num(c.energy, 0, 100, 90);
    c.hygiene = num(c.hygiene, 0, 100, 90); c.health = num(c.health, 0, 100, 100);
    c.poop = Math.floor(num(c.poop, 0, 4, 0)); c.poopP = num(c.poopP, 0, 500, 0); c.weight = num(c.weight, 30, 100, 50); c.stuff = num(c.stuff, 0, 10, 0);
    c.careSum = num(c.careSum, 0, 1e12, 0); c.careN = Math.floor(num(c.careN, 0, 1e9, 0)); c.cuddles = Math.floor(num(c.cuddles, 0, 1e9, 0));
    if (!c.forms || typeof c.forms !== 'object' || Array.isArray(c.forms)) c.forms = {};
    c.hat = HATS.some((x) => x.id === c.hat) ? c.hat : ''; c.toy = TOYS.some((x) => x.id === c.toy) ? c.toy : '';
    if (!c.w || typeof c.w !== 'object' || Array.isArray(c.w)) c.w = {};
    c.seed = (Math.floor(num(c.seed, 1, 4294967295, 12345))) >>> 0;
  } else p.cur = null;
  catchUp();
}

/* ===== Spielzeit ===== */
function rnd() { const c = C(); let t = (c.seed = (c.seed + 0x6D2B79F5) >>> 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const ageMin = (c) => Math.max(0, (now() - c.born) / 60000);
const stageFor = (m) => { let s = 0; AGE_AT.forEach((a, i) => { if (m >= a) s = i; }); return s; };
const heavy = (c) => c.weight >= 75;
const mean = (c) => (c.hunger + c.fun + c.energy + c.hygiene + c.health) / 5;
const quality = (c) => c.careN ? c.careSum / c.careN : 70;
function logEv(m) { const p = D(); p.log.unshift({ t: now(), m: m }); p.log.length = Math.min(p.log.length, 10); }
function warnOnce(c, key, low, msg) {
  const v = c[key];
  if (v < 20 && !c.w[key]) { c.w[key] = 1; logEv(msg); } else if (v > 40) c.w[key] = 0;
}
function die(c, how) {
  c.dead = true; c.how = how; c.asleep = false;
  D().hall.unshift({ name: c.name, species: SPECIES[c.species].name, days: Math.floor(ageMin(c) / 1440), stage: STAGES[c.stage], how: how, t: now() });
  if (D().hall.length > 50) D().hall.length = 50;
  if (how === 'alt') logEv(`„${c.name}“ ist friedlich eingeschlafen.`); else logEv(`„${c.name}“ ist gestorben.`);
}
function simulate(c, minutes) {
  const mercy = D().settings.mercy, minH = 3;
  for (let i = 0; i < minutes && !c.dead; i++) {
    if (c.stage === 0) continue;
    const a = c.asleep, hv = heavy(c);
    c.hunger = clamp(c.hunger - (a ? 0.04 : 0.12) * (hv ? 1.1 : 1));
    c.fun = clamp(c.fun - (a ? 0.02 : c.toy ? 0.07 : 0.09));
    c.energy = clamp(c.energy + (a ? 0.45 : hv ? -0.1 : -0.08));
    c.hygiene = clamp(c.hygiene - (a ? 0.02 : 0.05) - 0.03 * c.poop);
    if (!a) { c.poopP += 0.6 + rnd() * 0.8; if (c.poopP >= 110) { c.poopP = 0; if (c.poop < 4) { c.poop++; logEv(`„${c.name}“ hat ein Häufchen gemacht.`); } } }
    if (c.weight > 50) c.weight = Math.max(50, c.weight - 0.008);
    c.stuff = Math.max(0, c.stuff - 0.05);
    let h = c.health;
    if (c.hunger <= 0) h -= 0.12; else if (c.hunger < 15) h -= 0.05;
    if (c.hygiene < 10) h -= 0.05;
    if (c.poop >= 3) h -= 0.04;
    if (c.sick) h -= 0.08;
    else if (Math.min(c.hunger, c.fun, c.hygiene, c.energy) >= 15 && c.poop < 3) h += (a ? 0.12 : 0.06) * (hv ? 0.4 : 1);
    if (!c.sick && c.hygiene < 10 && c.poop >= 2 && rnd() < 0.002) { c.sick = true; logEv(`„${c.name}“ ist krank geworden.`); }
    c.health = clamp(h);
    if (!c.sick && c.health < 30) { c.sick = true; logEv(`„${c.name}“ ist krank geworden.`); }
    if (mercy && c.health < minH) c.health = minH;
    if (!mercy && c.health <= 0) { die(c, 'tot'); break; }
    if (!a && c.energy <= 0) { c.asleep = true; logEv(`„${c.name}“ ist vor Erschöpfung eingeschlafen.`); }
    if (a && c.energy >= 100) { c.asleep = false; logEv(`„${c.name}“ ist ausgeschlafen.`); }
    warnOnce(c, 'hunger', 20, `„${c.name}“ hat großen Hunger.`);
    warnOnce(c, 'fun', 20, `„${c.name}“ ist gelangweilt.`);
    warnOnce(c, 'hygiene', 20, `„${c.name}“ ist ziemlich schmutzig.`);
    c.careSum += mean(c); c.careN++;
    if (!mercy && ageMin(c) >= OLD_AGE) { die(c, 'alt'); break; }
  }
}
function checkStage(c) {
  if (c.dead) return false;
  const target = stageFor(ageMin(c));
  let ch = false;
  while (c.stage < target) {
    c.stage++; ch = true;
    if (c.stage >= 2) { const q = quality(c); c.forms[c.stage] = q >= 72 ? 'A' : q < 48 ? 'C' : 'B'; D().coins += 10; }
    if (c.stage === 1) logEv(`„${c.name}“ ist geschlüpft! 🐣`);
    else if (c.stage === 2) logEv(`„${c.name}“ ist jetzt ein Kind. (+10 Münzen)`);
    else if (c.stage === 3) logEv(`„${c.name}“ ist jetzt ein Teenager. (+10 Münzen)`);
    else if (c.stage === 4) logEv(`„${c.name}“ ist erwachsen geworden. (+10 Münzen)`);
    else logEv(`„${c.name}“ ist jetzt ein Senior. (+10 Münzen)`);
  }
  if (ch) { beep([[523, .1], [659, .1], [784, .1], [1047, .25]]); react = { until: Date.now() + 3000 }; }
  return ch;
}
// holt verpasste Zeit nach (max. 8 Stunden); gibt zurück, ob sich etwas geändert hat
function catchUp() {
  const c = D() && C();
  if (!c || c.dead) return false;
  const t = now();
  if (c.lastTick > t) c.lastTick = t;
  const steps = Math.floor((t - c.lastTick) / 60000);
  let ch = false;
  if (steps > 0) {
    const eff = Math.min(steps, OFFLINE_CAP);
    simulate(c, eff);
    if (steps > eff) c.lastTick = t; else c.lastTick += steps * 60000;
    if (steps >= 60 && !c.dead) { if (steps >= 2880) logEv(`Willkommen zurück! Du warst ${Math.round(steps / 1440)} Tage weg.`); else logEv(`Willkommen zurück! Du warst ${Math.round(steps / 60)} Std. weg.`); }
    ch = true;
  }
  if (checkStage(c)) ch = true;
  if (ch) dirty = true;
  return ch;
}
function save() { dirty = false; lastSave = Date.now(); store.changed(); }
function flush(force) { if (dirty && (force || Date.now() - lastSave > 10000)) save(); }
function tick() { if (!D()) return; if (catchUp()) renderTop(); if (react && react.until < Date.now()) { react = null; renderTop(); } flush(false); }
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden) { flush(true); const g = G.catch; if (g && g.state === 'run') g.pause(); } else tick(); });

      c && !c.dead ? h('button', { onclick: release }, 'Haustier abgeben …') : null),
    h('div', { class: 'card hall' }, h('h2', {}, '🏆 Ruhmeshalle'), hall));
}

/* ===== Test-Schnittstelle ===== */
window.__game = {
  get data() { return D(); }, get pet() { return C(); }, get state() { return G.mode; }, get game() { return G; }, get skew() { return skew; },
  now, tick, render, catchUp, simulate: (m) => { const c = C(); if (c) simulate(c, m); render(); },
  // Uhr um N Minuten vorstellen und die Spielzeit exakt (ohne Offline-Limit) nachrechnen
  advance(min) {
    const c = C(); skew += min * 60000;
    if (c && !c.dead) { const n = Math.floor(min); simulate(c, n); c.lastTick += n * 60000; checkStage(c); }
    save(); render();
  },
  // simuliert „App war N Minuten geschlossen“ (mit 8-Stunden-Limit)
  closedFor(min) { const c = C(); if (!c) return; c.lastTick -= min * 60000; c.born -= min * 60000; catchUp(); render(); },
  adopt(sp, name) { pick = sp; nameDraft = name || ''; adopt(); },
  set(patch) { Object.assign(C(), patch); render(); },
  act(name, arg) { return ({ feed, toggleSleep, wash, tidy: () => tidy(true), medicine, cuddle, revive, hatch, release, openGame })[name](arg); },
  buy(id) { const f = FOODS.find((x) => x.id === id); if (f) return buy(f, 'food'); const hh = HATS.find((x) => x.id === id); if (hh) return buy(hh, 'hat'); const t = TOYS.find((x) => x.id === id); if (t) return buy(t, 'toy'); },
  catchStep(sec) { const g = G.catch; if (!g) return; if (g.state === 'ready') g.start(); g.state = 'run'; for (let t = 0; t < sec && g.state === 'run'; t += 0.05) g.update(0.05); },
  setSeed(s) { grndState = s >>> 0; },
};

{ // Neuzeichnen darf sich nicht selbst unterbrechen (Blur/Change-Ereignisse beim Ersetzen von Elementen)
  const inner = render; let busy = false, again = false;
  render = function () {
    if (busy) { again = true; return; }
    busy = true; try { inner(); } finally { busy = false; }
    if (again) { again = false; render(); }
  };
}
store.restore();
normalize();
render();
</script>
