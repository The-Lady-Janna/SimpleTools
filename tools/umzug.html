  }

</style>
</head>

</main>
<script src="../shared/storage.js"></script>
<script>

  '1 Woche vorher': ['Kühlschrank und Gefrierschrank leeren und abtauen', 'Wertsachen und wichtige Dokumente separat packen', 'Erste-Nacht-Karton packen (Bettzeug, Hygieneartikel, Ladekabel)', 'Möbel abbauen und Schrauben beschriften', 'Bargeld für Trinkgeld und Verpflegung besorgen'],

const KINDS = ['Behörde', 'Bank', 'Versicherung', 'Arbeit & Schule', 'Verträge', 'Post & Abos', 'Sonstiges'];

  ['Arbeitgeber', 'Arbeit & Schule', ''], ['Schule oder Kita', 'Arbeit & Schule', ''],
  ['Strom und Gas', 'Verträge', 'Zählerstand melden, Anbieter ummelden'], ['Internet und Telefon', 'Verträge', 'Umzug oder Sonderkündigung'], ['Handyvertrag', 'Verträge', ''],
  ['Post-Nachsendeauftrag', 'Post & Abos', ''], ['Zeitungen und Zeitschriften', 'Post & Abos', ''], ['Online-Shops und Paketdienste', 'Post & Abos', ''],

const filt = { q: '', room: '', state: '' };

  const u = d.umzug;

}
function parseAmount(s) { s = String(s || '').trim().replace(/\s|€/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = Number(s); return Number.isFinite(n) ? Math.abs(n) : NaN; }

function printNodes(nodes) { $('printarea').replaceChildren(...nodes.flat(Infinity).filter(Boolean)); SimpleI18n.apply(); window.print(); }

function header() {
  const u = U();

}

}
