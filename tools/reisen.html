<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reiseplaner</title>
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/ui.js"></script>
<style>
  main { max-width: 960px; }
  .toolbar button { min-height: 38px; }
  .sp { flex: 1; }
  .muted { color: var(--muted); }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }
  .tabs button.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .badge { display:inline-block; padding:1px 8px; border-radius:99px; font-size:.78rem; border:1px solid var(--line); background:var(--bg); }
  .badge.ok { color:var(--ok); border-color:var(--ok); } .badge.warn { color:var(--warn); border-color:var(--warn); } .badge.err { color:var(--err); border-color:var(--err); }
  button.small { padding:2px 9px; font-size:.85rem; }
  [hidden] { display:none !important; }

  .layout { display:grid; grid-template-columns:270px minmax(0,1fr); gap:12px; align-items:start; }
  @media (max-width: 820px) { .layout { grid-template-columns:minmax(0,1fr); } }
  #jhead > .card:first-child, #view > .card:first-child { margin-top:0; }
  .pick { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); border-radius:0; background:transparent; padding:8px 6px; }
  .pick.on { background:color-mix(in srgb, var(--accent) 14%, var(--card)); }
  .pick .l1 { display:flex; gap:6px; align-items:center; justify-content:space-between; }
  .pick .l1 strong { overflow-wrap:anywhere; min-width:0; }
  .pick small { display:block; color:var(--muted); overflow-wrap:anywhere; }
  .badge.acc { color:var(--accent); border-color:var(--accent); } .badge { white-space:nowrap; }
  .sum { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin:12px 0; }
  .sum .card { margin:0; text-align:center; } .sum b { display:block; font-size:1.2rem; } .sum small { color:var(--muted); display:block; }
  .form { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; }
  label.f { display:flex; flex-direction:column; font-size:.8rem; color:var(--muted); gap:2px; min-width:0; }
  label.f input, label.f select { min-width:0; max-width:100%; }
  input.w { width:7em; } .grow { flex:1 1 10em; min-width:0; }
  .ferr { color:var(--err); font-size:.9rem; flex-basis:100%; }
  .pos { color:var(--ok); } .neg { color:var(--err); } .wn { color:var(--warn); } .sm { font-size:.85rem; }
  .dayh { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; margin-bottom:4px; }
  .dayh h3 { margin:0; font-size:1.02rem; overflow-wrap:anywhere; }
  .day.today { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .it { display:flex; gap:10px; align-items:flex-start; padding:6px 0; border-top:1px solid var(--line); }
  .it .tm { width:3.2em; flex:none; color:var(--muted); font-variant-numeric:tabular-nums; }
  .it .bd { flex:1; min-width:0; overflow-wrap:anywhere; } .it.bk .bd { color:var(--muted); }
  .it .acts { display:flex; gap:4px; flex:none; }
  .itform { padding:8px 0; border-top:1px solid var(--line); }
  .grp { margin:18px 0 6px; font-size:.85rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .bk { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; padding:9px 0; border-top:1px solid var(--line); }
  .bk.sel { background:color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .bk .main { flex:1 1 240px; min-width:0; overflow-wrap:anywhere; } .bk .side { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chk { display:inline-flex; gap:5px; align-items:center; } .chk input { width:18px; height:18px; }
  .ref { font-family:ui-monospace,Menlo,Consolas,monospace; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:0 6px; }
  .bar { height:12px; background:var(--bg); border:1px solid var(--line); border-radius:7px; overflow:hidden; margin:5px 0; }
  .bar > i { display:block; height:100%; background:var(--accent); } .bar.warn > i { background:var(--warn); } .bar.err > i { background:var(--err); }
  .brow { padding:8px 0; border-top:1px solid var(--line); } .brow:first-child { border-top:0; }
  .meta { display:flex; flex-wrap:wrap; justify-content:space-between; gap:2px 12px; font-size:.85rem; color:var(--muted); }
  .ex { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
  .ex.sel { background:color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .ex .nt { flex:1 1 8em; min-width:0; overflow-wrap:anywhere; }
  textarea.notes { width:100%; min-height:160px; font-family:inherit; }
  h3.t { margin:0 0 8px; font-size:1.05rem; }

</style>
</head>
<body>
<main>
  <p><a href="../index.html">← Alle Tools</a></p>
  <h1>Reiseplaner</h1>
  <div class="card toolbar">
    <button id="new">Neu</button>
    <button id="open">Öffnen…</button>
    <button id="save" class="primary">Speichern</button>
    <button id="saveas">Speichern unter…</button>
  </div>
  <div id="status"></div>

  <p class="muted" style="margin:-4px 0 8px">Teilt seine Datei mit den <a href="packlisten.html">Packlisten</a> – im Tab „Packliste“ legst du zur Reise eine passende Packliste an.</p>
  <div class="layout">
    <div class="card" id="side" style="padding:8px;margin:0"></div>
    <div style="min-width:0">
      <div id="jhead"></div>
      <div class="tabs" id="tabs"><button data-tab="ov">Überblick</button><button data-tab="plan">Tagesplan</button><button data-tab="book">Buchungen</button><button data-tab="budget">Budget</button><button data-tab="pack">Packliste</button></div>
      <div id="view"></div>
    </div>
  </div>

</main>
<script src="../shared/storage.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    if (k === 'class') e.className = props[k];
    else if (k === 'dataset') Object.assign(e.dataset, props[k]);
    else if (k.startsWith('on')) e[k] = props[k];
    else if (k === 'list' || k.includes('-') || k === 'role') e.setAttribute(k, props[k]);
    else e[k] = props[k];
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = (s) => s ? parseYmd(s).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '';
const eur = (n) => (n || 0).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
function download(name, text, type) {
  const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: type || 'text/plain;charset=utf-8' })), download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = h('textarea', { value: text }); document.body.append(t); t.select(); try { document.execCommand('copy'); } catch {} t.remove(); }
  if (btn) { const o = btn.textContent; btn.textContent = 'Kopiert ✓'; setTimeout(() => btn.textContent = o, 1200); }
}
const store = SimpleStorage.create({
  name: 'packlisten',
  defaults: () => ({ templates: [], trips: [], journeys: [] }),
  onChange: () => { normalize(); render(); },
  statusEl: $('status'),
});
$('new').onclick = () => store.new();
$('open').onclick = () => store.open();
$('save').onclick = () => store.save();
$('saveas').onclick = () => store.saveAs();

const CATS = ['Unterkunft', 'Transport', 'Essen', 'Aktivitäten', 'Einkäufe', 'Sonstiges'];
const TYPES = ['Flug', 'Unterkunft', 'Bahn', 'Mietwagen', 'Ticket', 'Sonstiges'];
const TYPE_ICON = { Flug: '✈️', Unterkunft: '🏨', Bahn: '🚆', Mietwagen: '🚗', Ticket: '🎫', Sonstiges: '📌' };
const TYPE_CAT = { Flug: 'Transport', Bahn: 'Transport', Mietwagen: 'Transport', Unterkunft: 'Unterkunft', Ticket: 'Aktivitäten', Sonstiges: 'Sonstiges' };
const MAXDAYS = 60;
let selId = null, tab = 'ov', editJ = null, ed = null, editB = null, editE = null, inclB = true, focusKey = null, packMsg = '';

const isYmd = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && ymd(parseYmd(s)) === s;
const today0 = () => parseYmd(ymd(new Date()));
const dayDiff = (a, b) => Math.round((b - a) / 86400000);
const fmtLong = (d) => isYmd(d) ? parseYmd(d).toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' }) : d;
const key = (s) => String(s || '').trim().toLowerCase();
const round2 = (n) => Math.round(n * 100) / 100;
const sum = (a, f) => round2(a.reduce((x, y) => x + f(y), 0));
function parseAmount(s) {
  s = String(s == null ? '' : s).trim().replace(/\s|€/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s); return Number.isFinite(n) ? round2(Math.abs(n)) : NaN;
}
const numStr = (n) => n ? String(n).replace('.', ',') : '';
const cur = () => store.data.journeys.find((j) => j.id === selId);

function normalize() {
  const d = store.data;
  for (const k of ['templates', 'trips', 'journeys']) if (!Array.isArray(d[k])) d[k] = [];
  const isObj = (o) => o && typeof o === 'object' && !Array.isArray(o);
  const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
  const str = (o, ks) => ks.forEach((k) => { if (typeof o[k] !== 'string') o[k] = o[k] == null ? '' : String(o[k]); });
  d.journeys = d.journeys.filter(isObj);
  d.journeys.forEach((j) => {
    if (!j.id) j.id = uid();
    str(j, ['name', 'dest', 'start', 'end', 'notes']);
    if (!isObj(j.days)) j.days = {};
    for (const k of Object.keys(j.days)) {
      j.days[k] = (Array.isArray(j.days[k]) ? j.days[k] : []).filter(isObj);
      j.days[k].forEach((it) => { if (!it.id) it.id = uid(); str(it, ['time', 'text', 'place']); });
    }
    j.bookings = (Array.isArray(j.bookings) ? j.bookings : []).filter(isObj);
    j.bookings.forEach((b) => { if (!b.id) b.id = uid(); str(b, ['title', 'ref', 'date', 'time', 'note']); if (!TYPES.includes(b.type)) b.type = 'Sonstiges'; b.cost = num(b.cost); b.paid = !!b.paid; });
    j.expenses = (Array.isArray(j.expenses) ? j.expenses : []).filter(isObj);
    j.expenses.forEach((e) => { if (!e.id) e.id = uid(); str(e, ['date', 'cat', 'note']); e.cat = e.cat.trim() || 'Sonstiges'; e.amount = num(e.amount); });
    if (!isObj(j.budget)) j.budget = {};
    for (const k of Object.keys(j.budget)) j.budget[k] = num(j.budget[k]);
  });
  if (!d.journeys.find((j) => j.id === selId)) { const s = sorted(); selId = s.length ? s[0].id : null; ed = editB = editE = null; if (editJ !== 'new') editJ = null; }
}

// ---------- Zeitraum & Countdown ----------
function range(j) {
  const s0 = isYmd(j.start) ? j.start : '', e0 = isYmd(j.end) ? j.end : '';
  const s = s0 || e0, e = e0 || s0;
  if (!s) return null;
  const bad = e < s, S = parseYmd(s), E = parseYmd(bad ? s : e);
  return { s: S, e: E, bad, days: dayDiff(S, E) + 1 };
}
function phase(j) {
  const r = range(j);
  if (!r) return { kind: 'none', text: 'ohne Datum', cls: '' };
  const t = today0(), n = dayDiff(t, r.s);
  if (n > 0) return { kind: 'future', n, text: 'in ' + n + (n === 1 ? ' Tag' : ' Tagen'), cls: 'acc' };
  if (dayDiff(t, r.e) >= 0) return { kind: 'run', text: 'läuft', cls: 'ok', day: 1 - n, of: r.days };
  return { kind: 'past', text: 'vorbei', cls: '' };
}
function sorted() {
  const grp = (j) => { const r = range(j); return !r ? 2 : dayDiff(today0(), r.e) >= 0 ? 0 : 1; };
  return store.data.journeys.slice().sort((a, b) => {
    const ga = grp(a), gb = grp(b); if (ga !== gb) return ga - gb;
    const sa = a.start || a.end || '', sb = b.start || b.end || '';
    return ga === 1 ? sb.localeCompare(sa) : sa.localeCompare(sb) || a.name.localeCompare(b.name);
  });
}
function dayList(j) {
  const r = range(j); if (!r) return { days: [], capped: false, total: 0 };
  const n = Math.min(r.days, MAXDAYS);
  return { days: Array.from({ length: n }, (_, i) => ymd(new Date(r.s.getFullYear(), r.s.getMonth(), r.s.getDate() + i))), capped: r.days > MAXDAYS, total: r.days };
}
const whenText = (j) => { const r = range(j); return r ? fmtDate(ymd(r.s)) + (r.days > 1 ? ' – ' + fmtDate(ymd(r.e)) : '') : 'Datum noch offen'; };

// ---------- Zahlen ----------
const bkSort = (a, b) => ((a.date || '9999-99-99') + (a.time || '99:99')).localeCompare((b.date || '9999-99-99') + (b.time || '99:99'));
function spentBy(j) {
  const exp = {}, bk = {};
  j.expenses.forEach((e) => { exp[e.cat] = (exp[e.cat] || 0) + e.amount; });
  if (inclB) j.bookings.forEach((b) => { const c = TYPE_CAT[b.type] || 'Sonstiges'; bk[c] = (bk[c] || 0) + b.cost; });
  return { exp, bk };
}
const spentOf = (s, c) => round2((s.exp[c] || 0) + (s.bk[c] || 0));
function budgetCats(j) {
  const s = spentBy(j);
  const extra = [...new Set([...Object.keys(j.budget), ...Object.keys(s.exp), ...Object.keys(s.bk)].filter((c) => !CATS.includes(c)))].sort((a, b) => a.localeCompare(b, 'de'));
  return CATS.concat(extra);
}
function totals(j) {
  const s = spentBy(j), cats = budgetCats(j);
  return { planned: round2(cats.reduce((a, c) => a + (j.budget[c] || 0), 0)), spent: round2(cats.reduce((a, c) => a + spentOf(s, c), 0)) };
}
const bookTotals = (j) => ({ all: sum(j.bookings, (b) => b.cost), paid: sum(j.bookings.filter((b) => b.paid), (b) => b.cost), open: sum(j.bookings.filter((b) => !b.paid), (b) => b.cost), unpaidN: j.bookings.filter((b) => !b.paid).length });
function barState(spent, planned) {
  const over = spent > planned + 0.004;
  return { cls: 'bar' + (over ? ' err' : planned > 0 && spent >= planned * 0.9 ? ' warn' : ''), pct: planned > 0 ? Math.min(100, spent / planned * 100) : (spent > 0 ? 100 : 0), over };
}
function errEl() { const e = h('div', { class: 'ferr', role: 'alert', hidden: true }); e.show = (t) => { e.textContent = t || ''; e.hidden = !t; }; return e; }
const L = (t, el) => h('label', { class: 'f' }, t, el);
const delBtn = (label, fn) => h('button', { class: 'small', title: 'Löschen', 'aria-label': label, onclick: fn }, '✕');
const editBtn = (label, fn) => h('button', { class: 'small', title: 'Bearbeiten', 'aria-label': label, onclick: fn }, '✎');

// ---------- Hauptansicht ----------
function render() {
  if (editJ && editJ !== 'new' && editJ !== selId) editJ = null;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  const j = cur(), showTabs = !!j && editJ !== 'new';
  $('side').replaceChildren(...sideList());
  $('tabs').hidden = !showTabs;
  $('jhead').replaceChildren(editJ ? journeyForm() : j ? journeyHead(j)
    : h('div', { class: 'card muted' }, store.data.journeys.length ? 'Wähle links eine Reise.' : 'Noch keine Reise. Lege links mit „+ Neue Reise“ deine erste an – mit Tagesplan, Buchungen, Budget und Packliste.'));
  $('view').replaceChildren(...(showTabs ? [tab === 'ov' ? ovView(j) : tab === 'plan' ? planView(j) : tab === 'book' ? bookView(j) : tab === 'budget' ? budgetView(j) : packView(j)] : []));
  if (focusKey) { const el = document.querySelector('[data-fk="' + focusKey + '"]'); focusKey = null; if (el) el.focus(); }
}
function sideList() {
  const out = [h('button', { class: 'primary small', style: 'margin:2px 4px 6px', onclick: () => { editJ = 'new'; focusKey = 'jname'; render(); } }, '+ Neue Reise')];
  const js = sorted();
  if (!js.length) out.push(h('p', { class: 'muted sm', style: 'padding:4px 6px;margin:0' }, 'Noch keine Reisen.'));
  js.forEach((j) => {
    const p = phase(j);
    out.push(h('button', { class: 'pick' + (j.id === selId && editJ !== 'new' ? ' on' : ''), onclick: () => { selId = j.id; editJ = null; ed = editB = editE = null; packMsg = ''; render(); } },
      h('div', { class: 'l1' }, h('strong', {}, j.name || 'Ohne Namen'), h('span', { class: 'badge ' + p.cls }, p.text)),
      h('small', {}, (j.dest ? j.dest + ' · ' : '') + whenText(j))));
  });
  return out;
}
function journeyHead(j) {
  const p = phase(j), r = range(j);
  return h('div', { class: 'card' }, h('div', { class: 'row' }, h('h2', { style: 'margin:0;font-size:1.2rem;overflow-wrap:anywhere;flex:1 1 9em;min-width:0' }, j.name || 'Ohne Namen'), h('span', { class: 'badge ' + p.cls }, p.text),
    h('button', { class: 'small', onclick: () => { editJ = j.id; focusKey = 'jname'; render(); } }, 'Bearbeiten'),
    h('button', { class: 'small', onclick: () => {
      if (!confirm('Reise „' + (j.name || 'Ohne Namen') + '“ mit Tagesplan, Buchungen und Budget löschen? Packlisten bleiben erhalten.')) return;
      store.data.journeys = store.data.journeys.filter((x) => x !== j); selId = null; store.changed(); normalize(); render();
    } }, 'Löschen')),
    h('div', { class: 'muted' }, (j.dest ? '📍 ' + j.dest + ' · ' : '') + whenText(j) + (r ? ' · ' + r.days + (r.days === 1 ? ' Tag' : ' Tage') : '')),
    r && r.bad ? h('div', { class: 'wn sm' }, '⚠ Das Ende liegt vor dem Start – es wird nur der Starttag verwendet.') : null);
}
function journeyForm() {
  const j = editJ === 'new' ? null : cur();
  const name = h('input', { type: 'text', required: true, value: j ? j.name : '', placeholder: 'z. B. Städtetrip Lissabon', 'aria-label': 'Name der Reise', dataset: { fk: 'jname' } });
  const dest = h('input', { type: 'text', value: j ? j.dest : '', placeholder: 'z. B. Lissabon, Portugal', 'aria-label': 'Reiseziel' });
  const start = h('input', { type: 'date', value: j ? j.start : '', 'aria-label': 'Start' });
  const end = h('input', { type: 'date', value: j ? j.end : '', 'aria-label': 'Ende' });
  const err = errEl();
  start.onchange = () => { if (start.value && (!end.value || end.value < start.value)) end.value = start.value; err.show(''); };
  end.onchange = () => err.show('');
  const f = h('form', { class: 'card form' }, L('Name', name), L('Ziel', dest), L('Start', start), L('Ende', end),
    h('button', { class: 'primary' }, j ? 'Übernehmen' : 'Reise anlegen'), h('button', { type: 'button', onclick: () => { editJ = null; render(); } }, 'Abbrechen'), err);
  f.onsubmit = (e) => {
    e.preventDefault();
    if (!name.value.trim()) { err.show('Bitte einen Namen eingeben.'); return; }
    if (start.value && end.value && end.value < start.value) { err.show('Das Ende liegt vor dem Start – bitte das Datum korrigieren.'); end.focus(); return; }
    const rec = { name: name.value.trim(), dest: dest.value.trim(), start: start.value, end: end.value };
    if (j) Object.assign(j, rec);
    else { const n = { id: uid(), ...rec, notes: '', days: {}, bookings: [], expenses: [], budget: {} }; store.data.journeys.push(n); selId = n.id; tab = 'ov'; ed = editB = editE = null; }
    editJ = null; store.changed(); render();
  };
  return f;
}

// ---------- Überblick ----------
function ovView(j) {
  const r = range(j), p = phase(j), bt = bookTotals(j), tt = totals(j), items = Object.values(j.days).reduce((a, l) => a + l.length, 0);
  const card = (t, big, sub, cls) => h('div', { class: 'card' }, h('small', {}, t), h('b', { class: cls || '' }, big), h('small', {}, sub));
  const left = tt.planned - tt.spent;
  const cd = p.kind === 'future' ? ['Countdown', p.text, 'Start am ' + fmtDate(ymd(r.s)), ''] : p.kind === 'run' ? ['Countdown', 'läuft', 'Tag ' + p.day + ' von ' + p.of, 'pos'] : p.kind === 'past' ? ['Countdown', 'vorbei', 'Ende am ' + fmtDate(ymd(r.e)), ''] : ['Countdown', '–', 'Kein Datum festgelegt', ''];
  const notes = h('textarea', { class: 'notes', placeholder: 'Notizen zur Reise: Ideen, Tipps, Visa, Adressen …', 'aria-label': 'Notizen' });
  notes.value = j.notes || ''; notes.oninput = () => { j.notes = notes.value; store.changed(); };
  return h('div', {}, h('div', { class: 'sum' },
    card('Zeitraum', r ? r.days + (r.days === 1 ? ' Tag' : ' Tage') : '–', r ? (r.days > 1 ? (r.days - 1) + (r.days === 2 ? ' Nacht · ' : ' Nächte · ') : '') + whenText(j) : 'Datum noch offen'),
    card(...cd),
