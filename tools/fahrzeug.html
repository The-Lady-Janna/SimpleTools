<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fahrzeug-Logbuch</title>
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/i18n.js"></script>
<script src="../shared/ui.js"></script>
<style>
  main { max-width: 960px; }
  .toolbar button { min-height: 38px; }
  .sp { flex: 1; }
  .muted { color: var(--muted); }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }
  .tabs button.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .badge { display:inline-block; padding:1px 8px; border-radius:99px; font-size:.78rem; border:1px solid var(--line); background:var(--bg); }
  .badge.ok { color:var(--ok); border-color:var(--ok); } .badge.warn { color:var(--warn); border-color:var(--warn); } .badge.err { color:var(--err); border-color:var(--err); }
  button.small { padding:2px 9px; font-size:.85rem; }
  [hidden] { display:none !important; }

  label.f { display:flex; flex-direction:column; font-size:.8rem; color:var(--muted); gap:2px; min-width:0; }
  label.f input, label.f select { min-width:0; width:100%; box-sizing:border-box; }
  .form { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; align-items:end; }
  .form .wide { grid-column:1/-1; }
  .vcard { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:10px 0; background:var(--bg); }
  .vcard h3 { margin:0 0 6px; font-size:1.05rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .vcard h3 .sp { flex:1; }
  .kv { display:grid; grid-template-columns:9.5em 1fr; gap:2px 10px; align-items:center; margin:4px 0; }
  .kv .v { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; }
  .kv .k { color:var(--muted); }
  @media (max-width:520px) { .kv { grid-template-columns:1fr; } }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin:10px 0; }
  .stat { border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--bg); }
  .stat b { display:block; font-size:1.2rem; } .stat span { color:var(--muted); font-size:.8rem; }
  .tw { overflow-x:auto; } table { width:100%; border-collapse:collapse; } td, th { padding:5px 6px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  td.n, th.n { text-align:right; } tr.tot td { font-weight:700; }
  .item { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line); } .item.done { opacity:.6; }
  .item .grow { flex:1; min-width:11em; }
  .hint { color:var(--muted); font-size:.82rem; }
  svg.chart { width:100%; height:auto; display:block; } svg.chart text { fill:var(--muted); font-size:11px; }
  h2.s { margin:0 0 6px; font-size:1.05rem; }

</style>
</head>
<body>
<main>
  <p><a href="../index.html">← Alle Tools</a></p>
  <h1>Fahrzeug-Logbuch</h1>
  <div class="card toolbar">
    <button id="new">Neu</button>
    <button id="open">Öffnen…</button>
    <button id="save" class="primary">Speichern</button>
    <button id="saveas">Speichern unter…</button>
  </div>
  <div id="status"></div>

  <div class="tabs"><button data-tab="cars">Fahrzeuge</button><button data-tab="fuel">Tanken</button><button data-tab="service">Service &amp; Reparaturen</button><button data-tab="due">Fristen</button><button data-tab="cost">Kosten</button></div>
  <div id="view"></div>

</main>
<script src="../shared/storage.js"></script>
<script>
'use strict';

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

  catch { const t = h('textarea', { value: text }); document.body.append(t); t.select(); try { document.execCommand('copy'); } catch {} t.remove(); }

}
const store = SimpleStorage.create({

  statusEl: $('status'),
});
$('new').onclick = () => store.new();
$('open').onclick = () => store.open();
$('save').onclick = () => store.save();
$('saveas').onclick = () => store.saveAs();

const ARTEN = ['Inspektion', 'Ölwechsel', 'Reparatur', 'Bremsen', 'Reifen', 'TÜV/HU', 'Sonstiges'];
const KINDS = ['Reifen', 'Termin', 'Erinnerung'];

function normalize() {

const daysTo = (s) => Math.round((parseYmd(s) - parseYmd(today())) / 86400000);

}

const cn = (x, d) => x == null || isNaN(x) ? '' : String(+x.toFixed(d == null ? 2 : d)).replace('.', ',');

  const s = h('select', { 'aria-label': 'Fahrzeug' }, allowAll ? h('option', { value: 'all' }, 'Alle Fahrzeuge') : null,
    store.data.vehicles.map((v) => h('option', { value: v.id, selected: v.id === curV }, v.name + (v.plate ? ' · ' + v.plate : ''))));
  s.value = curV; s.onchange = () => { curV = s.value; editFuel = editSvc = editRem = null; render(); };
  return h('div', { class: 'card toolbar' }, h('span', { class: 'muted' }, 'Fahrzeug:'), s);
}
function bumpKm(vid, km) { const v = vOf(vid); if (v && km > (v.km || 0)) v.km = km; }
function sel(v) { return curV === 'all' ? true : v === curV; }

function render() {
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  const v = $('view');
  if (tab !== 'cars' && !store.data.vehicles.length) {
    v.replaceChildren(h('div', { class: 'card muted' }, 'Lege zuerst unter „Fahrzeuge“ ein Fahrzeug an.')); return;

  if ((tab === 'fuel' || tab === 'service') && curV === 'all') curV = store.data.vehicles[0].id;

}

/* ---------- Fahrzeuge ---------- */
function carsView() {

  const km = inp('text', e.km != null ? String(e.km) : '', { inputMode: 'numeric', placeholder: '0', 'aria-label': 'Kilometerstand' });

      h('button', { class: 'small', onclick: () => { editCar = v.id; render(); scrollTo(0, 0); } }, 'Bearbeiten'),
      h('button', { class: 'small', onclick: () => { if (confirm('Fahrzeug „' + v.name + '“ mit allen Einträgen löschen?')) { for (const k of ['fuel', 'service', 'reminders']) d[k] = d[k].filter((x) => x.vid !== v.id); d.vehicles = d.vehicles.filter((x) => x !== v); normalize(); store.changed(); render(); } } }, 'Löschen')),

      h('div', { class: 'kv' }, h('span', { class: 'k' }, 'Versicherung'), h('div', { class: 'v' }, v.ins ? [fmtDate(v.ins), dueBadge(v.ins)] : h('span', { class: 'muted' }, 'nicht eingetragen'))),
      last ? h('div', { class: 'kv' }, h('span', { class: 'k' }, 'Letzter Service'), h('div', { class: 'v' }, fmtDate(last.date), h('span', { class: 'muted' }, last.type))) : null,
      nxt.map((n) => h('div', { class: 'kv' }, h('span', { class: 'k' }, 'Nächster Service'), h('div', { class: 'v' }, h('strong', {}, n.type), n.s.nextDate ? [fmtDate(n.s.nextDate), dueBadge(n.s.nextDate)] : null, n.s.nextKm ? [fmtKm(n.s.nextKm), kmBadge(n.s.nextKm, v.km || 0)] : null))));
  });
  return h('div', {}, f, d.vehicles.length ? h('div', { class: 'card' }, cards) : h('div', { class: 'card muted' }, 'Noch keine Fahrzeuge. Lege oben dein erstes Fahrzeug an.'),
    h('p', { class: 'hint' }, 'Der Kilometerstand wird beim Eintragen von Tankstopps und Services automatisch nachgeführt.'));
}
function nextServices(vid) {
  const m = {};
  for (const s of store.data.service) if (s.vid === vid && (s.nextKm || s.nextDate)) { if (!m[s.type] || s.date > m[s.type].date || (s.date === m[s.type].date && (s.km || 0) > (m[s.type].km || 0))) m[s.type] = s; }
  return Object.keys(m).map((t) => ({ type: t, s: m[t] })).sort((a, b) => (a.s.nextDate || '9').localeCompare(b.s.nextDate || '9'));
}

/* ---------- Tanken ---------- */
function fuelStats(vid) {
  const es = store.data.fuel.filter((f) => f.vid === vid).sort((a, b) => a.km - b.km || a.date.localeCompare(b.date));
  let lastKm = null, l = 0, c = 0, SL = 0, SC = 0, SD = 0;

    }

function fuelView() {

    h('div', { class: 'row' }, h('button', { class: 'primary' }, editFuel ? 'Speichern' : 'Tankstopp hinzufügen'), editFuel ? h('button', { type: 'button', onclick: () => { editFuel = null; render(); } }, 'Abbrechen') : null)));
  f.onsubmit = (ev) => {

  };
  const st = fuelStats(curV), rows = st.es.slice().reverse();
  const tot = st.es.reduce((a, x) => a + x.cost, 0), lsum = st.es.reduce((a, x) => a + x.liters, 0);

  const table = rows.length ? h('div', { class: 'tw' }, h('table', {}, h('thead', {}, h('tr', {}, h('th', {}, 'Datum'), h('th', { class: 'n' }, 'Kilometerstand'), h('th', { class: 'n' }, 'Liter'), h('th', { class: 'n' }, 'Preis'), h('th', { class: 'n' }, '€ / Liter'), h('th', {}, 'Voll'), h('th', { class: 'n' }, 'Verbrauch'), h('th', { class: 'n' }, 'Kosten/km'), h('th', {}, ''))),
