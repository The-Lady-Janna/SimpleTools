</style>

</main>
<script src="../shared/storage.js"></script>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
function h(tag, props, ...kids) {

}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

function download(name, text, type) {
  const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: type || 'text/plain;charset=utf-8' })), download: name });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = h('textarea', { value: text }); document.body.append(t); t.select(); try { document.execCommand('copy'); } catch {} t.remove(); }
  if (btn) { const o = btn.textContent; btn.textContent = 'Kopiert ✓'; setTimeout(() => btn.textContent = o, 1200); }
}
const store = SimpleStorage.create({
  name: 'familie',
  defaults: () => ({ kids: [], tasks: [], done: {}, rewards: [], redeemed: [], pocket: {} }),
  onChange: () => { normalize(); render(); },
  statusEl: $('status'),

$('new').onclick = () => store.new();
$('open').onclick = () => store.open();
$('save').onclick = () => store.save();
$('saveas').onclick = () => store.saveAs();

const WD = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const PAL = ['--c1', '--c2', '--c3', '--c4', '--c5'];
const KID_EMO = ['🦊', '🐻', '🐼', '🐯', '🦁', '🐸', '🐵', '🦄', '🐙', '🐱', '🐶', '🐰', '🦋', '🚀', '🌈', '👧', '👦'];
const TASK_EMO = ['🪥', '🛏️', '🧹', '🍽️', '📚', '🗑️', '🐕', '🧺', '🎒', '🥦', '🧸', '🚲', '🌱', '🧼', '🎹', '👕'];
const REW_EMO = ['🍦', '🎬', '🎮', '🧸', '🍕', '🎡', '🍫', '📱', '⚽', '🎁', '🏊', '🎨'];
const wdIdx = (d) => (d.getDay() + 6) % 7;
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const monday = (d) => addDays(d, -wdIdx(d));
const isoWeek = (d) => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7) + 3); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 4)); return 1 + Math.round(((t - y0) / 86400000 - 3 + ((y0.getUTCDay() + 6) % 7)) / 7); };
let tab = 'today', sel = null, weekStart = monday(new Date()), edit = null, popKey = null, focusKey = null, msg = '', scrollTo = null, BAL = new Map(), curDay = ymd(new Date());

const isObj = (o) => o && typeof o === 'object' && !Array.isArray(o);
const str = (v) => (typeof v === 'string' ? v : '');
const num = (v, def, lo) => { v = Math.round(Number(v)); return Number.isFinite(v) ? Math.max(lo, v) : def; };
const round2 = (n) => Math.round(n * 100) / 100;
function normColor(c, i) { const m = String(c || '').match(/^(?:var\()?(?:--)?c([1-5])\)?$/); if (m) return '--c' + m[1]; return /^#[0-9a-f]{3,8}$/i.test(String(c)) ? String(c) : PAL[i % 5]; }
function normalize() {
  const d = store.data, ids = new Set();

  d.kids.forEach((k, i) => { fix(k); k.name = str(k.name); k.emoji = str(k.emoji) || '🙂'; k.color = normColor(k.color, i); k.allowance = Number(k.allowance) > 0 ? round2(Number(k.allowance)) : 0; });
  d.tasks.forEach((t) => {
    fix(t); t.name = str(t.name); t.emoji = str(t.emoji) || '⭐'; t.points = num(t.points, 1, 0);
    t.days = [...new Set((Array.isArray(t.days) ? t.days : []).map(Number).filter((x) => Number.isInteger(x) && x >= 0 && x <= 6))].sort();
    t.kidIds = Array.isArray(t.kidIds) ? t.kidIds.filter((x) => typeof x === 'string') : [];
  });
  d.rewards.forEach((r) => { fix(r); r.name = str(r.name); r.emoji = str(r.emoji) || '🎁'; r.cost = num(r.cost, 1, 0); });
  d.redeemed.forEach((r) => { fix(r); r.kidId = str(r.kidId); r.rewardId = str(r.rewardId); r.name = str(r.name); r.cost = num(r.cost, 0, 0); r.date = str(r.date) || ymd(new Date()); });
  for (const day of Object.keys(d.done)) { const a = Array.isArray(d.done[day]) ? [...new Set(d.done[day].filter((x) => typeof x === 'string' && x.includes(':')))] : []; if (a.length) d.done[day] = a; else delete d.done[day]; }
  for (const k of Object.keys(d.pocket)) {
    d.pocket[k] = (Array.isArray(d.pocket[k]) ? d.pocket[k] : []).filter(isObj);
    d.pocket[k].forEach((e) => { fix(e); e.date = str(e.date) || ymd(new Date()); e.amount = Number.isFinite(Number(e.amount)) ? round2(Number(e.amount)) : 0; e.note = str(e.note); });
  }
}
const kidById = (id) => store.data.kids.find((k) => k.id === id);
const selKid = () => kidById(sel);
const kcol = (k) => (k.color.startsWith('#') ? k.color : 'var(' + k.color + ')');
const kstyle = (k) => '--kc:' + kcol(k);
const taskDue = (t, kid, date) => (!t.days.length || t.days.includes(wdIdx(date))) && (!t.kidIds.length || t.kidIds.includes(kid.id));
const isDone = (day, t, kid) => (store.data.done[day] || []).includes(t.id + ':' + kid.id);
const sumPts = (ts) => ts.reduce((a, t) => a + t.points, 0);
function calcBalances() {
  const d = store.data, pts = new Map(d.tasks.map((t) => [t.id, t.points])), b = new Map(d.kids.map((k) => [k.id, 0]));
  for (const day in d.done) for (const key of d.done[day]) { const i = key.indexOf(':'), p = pts.get(key.slice(0, i)), k = key.slice(i + 1); if (p != null && b.has(k)) b.set(k, b.get(k) + p); }
  d.redeemed.forEach((r) => { if (b.has(r.kidId)) b.set(r.kidId, b.get(r.kidId) - r.cost); });
  return b;
}
function toggle(day, t, kid) {
  const d = store.data, key = t.id + ':' + kid.id, a = d.done[day] || (d.done[day] = []), i = a.indexOf(key);
  if (i >= 0) a.splice(i, 1); else a.push(key);

  store.changed(); render();
}
function parseAmount(s) { s = String(s || '').trim().replace(/\s|€/g, '').replace(/^[+-]/, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = Number(s); return Number.isFinite(n) ? round2(Math.abs(n)) : NaN; }
const fmtNum = (n) => n.toFixed(2).replace('.', ',');
const L = (t, el) => h('label', { class: 'f' }, t, el);
const empty = (emoji, text, ...more) => h('div', { class: 'card empty' }, h('div', { class: 'em' }, emoji), h('p', {}, text), ...more);
function loadSample() {
  const d = store.data, T = (name, emoji, points, days) => ({ id: uid(), name, emoji, points, days, kidIds: [] }), R = (name, emoji, cost) => ({ id: uid(), name, emoji, cost });

  d.rewards.push(R('Eis essen', '🍦', 10), R('30 Min. Spielzeit', '🎮', 8), R('Filmabend', '🎬', 25), R('Kleines Spielzeug', '🧸', 50));

}
function noKids() { return empty('👨‍👩‍👧‍👦', 'Noch keine Kinder angelegt. Lege unter „Verwalten“ Kinder, Aufgaben und Belohnungen an – oder starte mit Beispieldaten.',

  const cost = h('input', { type: 'number', min: 1, step: 1, required: true, 'aria-label': 'Kosten in Punkten', value: cur ? cur.cost : 10, style: 'width:6em' });
  const cancel = h('button', { type: 'button', hidden: !cur, onclick: endEdit }, 'Abbrechen');
  const f = h('form', { class: 'card form', id: 'f-reward' }, L('Belohnung', name), L('Emoji', emoji), L('Kosten ⭐', cost), picker(emoji, REW_EMO), h('button', { class: 'primary' }, cur ? 'Übernehmen' : 'Belohnung hinzufügen'), cancel);
  f.onsubmit = (e) => {
    e.preventDefault(); const rec = { name: name.value.trim(), emoji: emoji.value.trim() || '🎁', cost: num(cost.value, 1, 1) };
    if (!rec.name) return;
    if (cur) Object.assign(cur, rec); else d.rewards.push({ id: uid(), ...rec });
    edit = null; store.changed(); render();
  };
  return f;
}
function manageView() {
  const d = store.data;
  const delBtn = (what, fn) => h('button', { class: 'small', title: 'Löschen', 'aria-label': what + ' löschen', onclick: fn }, '✕');
  const kids = d.kids.map((k) => h('div', { class: 'item', style: kstyle(k) }, h('span', { class: 'mini' }, k.emoji), h('div', { class: 'nm' }, h('strong', {}, k.name), h('div', { class: 'meta' }, '⭐ ' + (BAL.get(k.id) || 0) + ' Punkte' + (k.allowance > 0 ? ' · Wochengeld ' + eur(k.allowance) : ''))),
    h('button', { class: 'small', title: 'Bearbeiten', 'aria-label': k.name + ' bearbeiten', onclick: () => startEdit('kid', k.id) }, '✎'),
    delBtn(k.name, () => {
      if (!confirm('„' + k.name + '“ löschen? Alle Haken, Einlösungen und Taschengeld-Buchungen dieses Kindes gehen verloren.')) return;
      d.kids = d.kids.filter((x) => x !== k); d.redeemed = d.redeemed.filter((r) => r.kidId !== k.id); delete d.pocket[k.id];
      for (const day of Object.keys(d.done)) { d.done[day] = d.done[day].filter((x) => x.slice(x.indexOf(':') + 1) !== k.id); if (!d.done[day].length) delete d.done[day]; }
      d.tasks.forEach((t) => { t.kidIds = t.kidIds.filter((x) => x !== k.id); });
      edit = null; store.changed(); render();
    })));
  const tasks = d.tasks.map((t) => h('div', { class: 'item' }, h('span', { class: 'em' }, t.emoji), h('div', { class: 'nm' }, h('strong', {}, t.name), h('div', { class: 'meta' }, daysText(t) + ' · ' + (t.kidIds.length ? t.kidIds.map((id) => (kidById(id) || { name: '?' }).name).join(', ') : 'alle Kinder'))),
    h('span', { class: 'cost' }, '+' + t.points + ' ⭐'),
    h('button', { class: 'small', title: 'Bearbeiten', 'aria-label': t.name + ' bearbeiten', onclick: () => startEdit('task', t.id) }, '✎'),
    delBtn(t.name, () => {
      let n = 0; for (const day in d.done) n += d.done[day].filter((x) => x.startsWith(t.id + ':')).length;
      if (!confirm('„' + t.name + '“ löschen?' + (n ? ' Die ' + n + ' bereits gesetzten Haken (und ihre Punkte) werden ebenfalls entfernt.' : ''))) return;
      d.tasks = d.tasks.filter((x) => x !== t);
      for (const day of Object.keys(d.done)) { d.done[day] = d.done[day].filter((x) => !x.startsWith(t.id + ':')); if (!d.done[day].length) delete d.done[day]; }
      edit = null; store.changed(); render();
    })));
  const rewards = d.rewards.map((r) => h('div', { class: 'item' }, h('span', { class: 'em' }, r.emoji), h('div', { class: 'nm' }, h('strong', {}, r.name)), h('span', { class: 'cost' }, '⭐ ' + r.cost),
    h('button', { class: 'small', title: 'Bearbeiten', 'aria-label': r.name + ' bearbeiten', onclick: () => startEdit('reward', r.id) }, '✎'),
    delBtn(r.name, () => { if (confirm('„' + r.name + '“ löschen? Bereits eingelöste Belohnungen bleiben im Verlauf erhalten.')) { d.rewards = d.rewards.filter((x) => x !== r); edit = null; store.changed(); render(); } })));
  const list = (items, text) => h('div', { class: 'card' }, items.length ? items : h('p', { class: 'muted', style: 'margin:0' }, text));
  return h('div', {},
    !d.kids.length && !d.tasks.length && !d.rewards.length ? h('div', { class: 'card' }, h('strong', {}, 'Neu hier? '), 'Lege Kinder, Aufgaben und Belohnungen an – oder probiere es mit ', h('button', { class: 'small', onclick: loadSample }, 'Beispieldaten')) : null,
    h('h2', { class: 'sec' }, '🧒 Kinder'), kidForm(), list(kids, 'Noch keine Kinder.'),
    h('h2', { class: 'sec' }, '✅ Aufgaben'), taskForm(), list(tasks, 'Noch keine Aufgaben.'),
    h('h2', { class: 'sec' }, '🎁 Belohnungen'), rewardForm(), list(rewards, 'Noch keine Belohnungen.'));
}
document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => { tab = b.dataset.tab; edit = null; msg = ''; render(); });
// Datumswechsel bei offenem Tablet über Nacht
setInterval(() => { if (ymd(new Date()) !== curDay) { weekStart = monday(new Date()); render(); } }, 30000);

{ // Neuzeichnen darf sich nicht selbst unterbrechen (Blur/Change-Ereignisse beim Ersetzen von Elementen)
  const inner = render; let busy = false, again = false;
  render = function () {
    if (busy) { again = true; return; }
    busy = true; try { inner(); } finally { busy = false; }
    if (again) { again = false; render(); }
  };
}
store.restore();
normalize();
render();
</script>
