<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geschenke &amp; Wunschlisten</title>
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/i18n.js"></script>
<script src="../shared/ui.js"></script>
<style>
  main { max-width: 960px; }
  .toolbar button { min-height: 38px; }
  .sp { flex: 1; }
  .muted { color: var(--muted); }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }
  .tabs button.on { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .badge { display:inline-block; padding:1px 8px; border-radius:99px; font-size:.78rem; border:1px solid var(--line); background:var(--bg); }
  .badge.ok { color:var(--ok); border-color:var(--ok); } .badge.warn { color:var(--warn); border-color:var(--warn); } .badge.err { color:var(--err); border-color:var(--err); }
  button.small { padding:2px 9px; font-size:.85rem; }
  [hidden] { display:none !important; }

  .sum { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; }
  .sum .card { margin:0; text-align:center; } .sum b { display:block; font-size:1.2rem; }
  .form { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; }
  label.f { display:flex; flex-direction:column; font-size:.8rem; color:var(--muted); gap:2px; min-width:0; }
  input.w { width:7em; } label.f.grow { flex:1; min-width:150px; }
  .form input, .form select, .form textarea { max-width:100%; }
  h2.sec { font-size:1.05rem; margin:16px 0 6px; }
  .ev { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .ev .dt { min-width:4.2em; text-align:center; font-weight:600; border-right:1px solid var(--line); padding-right:12px; }
  .ev .info { flex:1; min-width:160px; } .ev .info b { word-break:break-word; }
  .ev .acts { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .meta { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:.88rem; color:var(--muted); align-items:center; }
  .pc .head { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; } .pc h3 { margin:0; font-size:1.1rem; flex:1; min-width:8em; word-break:break-word; }
  .note { white-space:pre-wrap; font-size:.9rem; margin:6px 0 0; word-break:break-word; }
  .idea { display:flex; gap:8px 12px; align-items:center; flex-wrap:wrap; padding:8px 0; border-top:1px solid var(--line); }
  .idea:first-child { border-top:0; } .idea .tx { flex:1; min-width:150px; word-break:break-word; }
  .idea select { max-width:9.5em; }
  .bar { position:relative; height:16px; background:var(--bg); border:1px solid var(--line); border-radius:8px; overflow:hidden; margin:6px 0; }
  .bar i { position:absolute; left:0; top:0; bottom:0; display:block; }
  .bar .pl { background:var(--c2, var(--line)); opacity:.45; } .bar .sp2 { background:var(--accent); } .bar.over .sp2 { background:var(--err); }
  .bar u { position:absolute; top:-1px; bottom:-1px; width:2px; background:var(--fg); }
  .legend { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:.85rem; } .legend span { white-space:nowrap; }
  .it { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:6px 0; border-top:1px solid var(--line); } .it:first-of-type { border-top:0; }
  .it .tx { flex:1; min-width:140px; word-break:break-word; } .it.res .tx { text-decoration:line-through; color:var(--muted); }
  textarea.exp { width:100%; min-height:9em; box-sizing:border-box; font-family:inherit; }
  .yr { font-weight:600; margin:12px 0 2px; }
  .neg { color:var(--err); } .pos { color:var(--ok); }
  details > summary { cursor:pointer; }

</style>
</head>
<body>
<main>
  <p><a href="../index.html">← Alle Tools</a></p>
  <h1>Geschenke &amp; Wunschlisten</h1>
  <div class="card toolbar">
    <button id="new">Neu</button>
    <button id="open">Öffnen…</button>
    <button id="save" class="primary">Speichern</button>
    <button id="saveas">Speichern unter…</button>
  </div>
  <div id="status"></div>

  <div class="sum">
    <div class="card"><span class="muted">Nächster Anlass</span><b id="snext"></b></div>
    <div class="card"><span class="muted">Geplant (dieses Jahr)</span><b id="splan"></b></div>
    <div class="card"><span class="muted">Ausgegeben (dieses Jahr)</span><b id="sspent"></b></div>
  </div>
  <div class="tabs" id="tabs">
    <button data-tab="occ">🗓️ Anlässe</button><button data-tab="per">👥 Personen</button><button data-tab="ide">💡 Ideen</button>
    <button data-tab="bud">💶 Budget</button><button data-tab="wish">📝 Wunschlisten</button><button data-tab="his">📚 Historie</button>
  </div>

  <section id="s-occ">
    <div id="occNext"></div>
    <details class="card"><summary>Eigenen Anlass hinzufügen</summary>
      <form id="oform" class="form" style="margin-top:8px">
        <label class="f grow">Name<input type="text" id="oname" required placeholder="z. B. Hochzeitstag oder Einweihung"></label>
        <label class="f">Datum<input type="date" id="odate" required></label>
        <label class="f" style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="oyearly" checked> jährlich wiederholen</label>
        <button class="primary">Hinzufügen</button>
      </form>
    </details>
    <div id="occCustom"></div>
  </section>

  <section id="s-per" hidden>
    <form id="pform" class="card form">
      <label class="f grow">Name<input type="text" id="pname" required placeholder="z. B. Oma Ruth"></label>
      <label class="f">Beziehung<select id="prel"><option value="Familie">Familie</option><option value="Partner(in)">Partner(in)</option><option value="Freund(in)">Freund(in)</option><option value="Kollege/Kollegin">Kollege/Kollegin</option><option value="Bekannte(r)">Bekannte(r)</option><option value="Sonstige">Sonstige</option></select></label>
      <label class="f">Geburtstag<input type="date" id="pbday"></label>
      <label class="f">Budget pro Anlass (€)<input type="text" id="pbud" class="w" inputmode="decimal" placeholder="0"></label>
      <label class="f grow" style="flex-basis:100%">Größen &amp; Vorlieben<textarea id="pnote" rows="2" placeholder="z. B. Kleidergröße M, mag Tee, kein Parfum"></textarea></label>
      <button class="primary" id="psub">Hinzufügen</button><button type="button" id="pcancel" hidden>Abbrechen</button>
    </form>
    <div id="perList"></div>
  </section>

  <section id="s-ide" hidden>
    <form id="iform" class="card form">
      <label class="f"><span>Für</span><select id="iper" required></select></label>
      <label class="f grow">Idee<input type="text" id="itext" required placeholder="z. B. Kochbuch oder Wollschal"></label>
      <label class="f">Preis (€)<input type="text" id="iprice" class="w" inputmode="decimal" placeholder="0"></label>
      <label class="f">Anlass<select id="iocc"></select></label>
      <label class="f">Jahr<input type="number" id="iyear" class="w" min="2000" max="2100" required></label>
      <label class="f">Status<select id="istat"></select></label>
      <label class="f grow" style="flex-basis:100%">Link oder Notiz<input type="text" id="inote" placeholder="https://… oder Hinweis"></label>
      <button class="primary" id="isub">Hinzufügen</button><button type="button" id="icancel" hidden>Abbrechen</button>
    </form>
    <div class="row" style="margin-bottom:8px">
      <label class="f">Person<select id="fper"></select></label>
      <label class="f">Jahr<select id="fyear"></select></label>
      <label class="f">Status<select id="fstat"></select></label>
    </div>
    <div id="ideaList"></div>
  </section>

  <section id="s-bud" hidden>
    <div class="row" style="margin-bottom:8px"><label class="f">Jahr<select id="byear"></select></label></div>
    <div id="budList"></div>
  </section>

  <section id="s-wish" hidden>
    <form id="wform" class="card form">
      <label class="f grow">Neue Wunschliste<input type="text" id="wname" required placeholder="z. B. Mein Geburtstag oder Weihnachten"></label>
      <button class="primary">Anlegen</button>
    </form>
    <div id="wishList"></div>
  </section>

  <section id="s-his" hidden>
    <div class="card form">
      <label class="f"><span>Person</span><select id="hper"></select></label>
      <label class="f grow">Schon geschenkt? Prüfen<input type="search" id="hq" placeholder="Idee eintippen …"></label>
    </div>
    <div id="hisList"></div>
  </section>

</main>
<script src="../shared/storage.js"></script>
<script>

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = (n) => String(n).padStart(2, '0');

  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

}
const store = SimpleStorage.create({

$('new').onclick = () => store.new();
$('open').onclick = () => store.open();
$('save').onclick = () => store.save();

const STATUS = ['Idee', 'Bestellt', 'Da', 'Verpackt', 'Übergeben'];
const PRIOS = ['hoch', 'mittel', 'niedrig'];
const PRIO_LABEL = { hoch: '★★★ Hoch', mittel: '★★ Mittel', niedrig: '★ Niedrig' };
const OCC = ['Geburtstag', 'Weihnachten', 'Sonstiges'];
const SPENT = ['Bestellt', 'Da', 'Verpackt', 'Übergeben'];
let tab = 'occ', editP = null, editI = null;
const openExport = new Set();
const thisYear = () => new Date().getFullYear();
const T = (s) => SimpleI18n.translate(s);
const setKids = (el, ...k) => el.replaceChildren(...k.flat(Infinity).filter((x) => x != null && x !== false));
function normalize() {
  const d = store.data;
  ['persons', 'occasions', 'ideas', 'wishlists'].forEach((k) => { if (!Array.isArray(d[k])) d[k] = []; });
  d.wishlists.forEach((w) => { if (!Array.isArray(w.items)) w.items = []; });
}
function parseAmount(s) { s = String(s || '').trim().replace(/\s|€/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = Number(s); return Number.isFinite(n) ? Math.abs(n) : NaN; }

const today0 = () => parseYmd(ymd(new Date()));
const dayDiff = (d) => Math.round((d - today0()) / 86400000);
const person = (id) => store.data.persons.find((p) => p.id === id);
const cd = (n) => n === 0 ? 'Heute 🎉' : n === 1 ? 'Morgen' : `in ${n} Tagen`;
const cdBadge = (n) => h('span', { class: 'badge ' + (n <= 7 ? 'err' : n <= 30 ? 'warn' : '') }, cd(n));
const shortDate = (d) => d.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
function nextOcc(mm, dd, yearly, fullYear) {
  const t = today0(); let y = t.getFullYear();
  let d = new Date(y, mm, dd);
  if (!yearly) { d = new Date(fullYear, mm, dd); return d >= t ? d : null; }
  if (d < t) d = new Date(y + 1, mm, dd);
  return d;
}
function events() {
  const d = store.data, out = [];
  d.persons.forEach((p) => { if (!p.bday) return; const b = parseYmd(p.bday); const dt = nextOcc(b.getMonth(), b.getDate(), true); out.push({ kind: 'bday', date: dt, p, occ: 'Geburtstag', age: b.getFullYear() > 1900 ? dt.getFullYear() - b.getFullYear() : 0 }); });
  const t = today0(); let x = new Date(t.getFullYear(), 11, 24); if (x < t) x = new Date(t.getFullYear() + 1, 11, 24);
  out.push({ kind: 'xmas', date: x, occ: 'Weihnachten' });
  d.occasions.forEach((o) => { const b = parseYmd(o.date); const dt = nextOcc(b.getMonth(), b.getDate(), o.yearly, b.getFullYear()); if (dt) out.push({ kind: 'custom', date: dt, o, occ: o.name }); });
  return out.sort((a, b) => a.date - b.date || (a.kind === 'bday' ? -1 : 1));
}
const ideasFor = (ev) => store.data.ideas.filter((i) => i.year === ev.date.getFullYear() && i.occ === ev.occ && (ev.kind !== 'bday' || i.person === ev.p.id));
const spentOf = (list) => list.filter((i) => SPENT.includes(i.status)).reduce((a, i) => a + (i.price || 0), 0);
const planOf = (list) => list.reduce((a, i) => a + (i.price || 0), 0);
function gotoIdeas(personId, occ, year) {
  tab = 'ide'; editI = null; render();
  $('iper').value = personId || $('iper').value; $('iocc').value = occ || 'Geburtstag'; $('iyear').value = year || thisYear(); $('itext').focus();
}
function evRow(ev) {
  const n = dayDiff(ev.date), ids = ideasFor(ev), ready = ids.filter((i) => ['Da', 'Verpackt', 'Übergeben'].includes(i.status)).length;
  const info = [];
  if (ev.kind === 'bday') info.push(h('div', {}, h('span', { class: 'muted' }, 'Geburtstag'), ' ', h('b', {}, ev.p.name), ev.age ? h('span', { class: 'muted' }, ' ' + `wird ${ev.age}`) : null));
  else if (ev.kind === 'xmas') info.push(h('div', {}, h('b', {}, '🎄 Weihnachten')));
  else info.push(h('div', {}, h('b', {}, '🎉 ' + ev.o.name)));
  const meta = [];
  if (ids.length) meta.push(h('span', {}, ids.length === 1 ? '1 Idee' : `${ids.length} Ideen`), h('span', {}, `${ready} bereit`), h('span', {}, 'Geplant: ' + eur(planOf(ids))));
  else if (ev.kind !== 'bday') meta.push(h('span', {}, 'Noch keine Ideen'));
  if (ev.kind === 'bday' && !ids.length) meta.push(h('span', { class: 'badge warn' }, 'Noch keine Idee'));
  if (ev.kind === 'bday' && ev.p.budget > 0) meta.push(h('span', {}, 'Budget: ' + eur(ev.p.budget)));
  if (ev.kind === 'xmas') { const no = store.data.persons.filter((p) => !ids.some((i) => i.person === p.id)); if (no.length) meta.push(h('span', {}, 'Noch keine Idee für:', ' ', no.map((p) => p.name).join(', '))); }
  return h('div', { class: 'card ev' }, h('div', { class: 'dt' }, shortDate(ev.date)), h('div', { class: 'info' }, info, h('div', { class: 'meta' }, meta)),
    h('div', { class: 'acts' }, cdBadge(n), h('button', { class: 'small', onclick: () => gotoIdeas(ev.kind === 'bday' ? ev.p.id : '', ev.occ, ev.date.getFullYear()) }, '+ Idee')));
}
function renderOcc() {

    later.length ? h('h2', { class: 'sec' }, 'Später') : null, later.map(evRow));

  setKids($('occCustom'), oc.length ? h('h2', { class: 'sec' }, 'Eigene Anlässe') : null, oc.map((o) => h('div', { class: 'card row' }, h('b', { class: 'tx', style: 'flex:1' }, o.name), h('span', { class: 'muted' }, fmtDate(o.date)), h('span', { class: 'badge' }, o.yearly ? 'jährlich' : 'einmalig'),
    h('button', { class: 'small', title: 'Löschen', 'aria-label': 'Löschen', onclick: () => { if (confirm(`„${o.name}“ löschen?`)) { store.data.occasions = oc.filter((x) => x !== o); store.changed(); render(); } } }, '✕'))));
}
function renderPer() {
  const ps = store.data.persons.slice().sort((a, b) => a.name.localeCompare(b.name));

    const ids = store.data.ideas.filter((i) => i.person === p.id), meta = [h('span', { class: 'badge' }, p.rel)];
    if (p.bday) { const b = parseYmd(p.bday), nx = nextOcc(b.getMonth(), b.getDate(), true), n = dayDiff(nx); meta.push(h('span', {}, '🎂 ' + fmtDate(p.bday)), cdBadge(n)); }
    if (p.budget > 0) meta.push(h('span', {}, 'Budget: ' + eur(p.budget)));
    meta.push(ids.length === 1 ? h('span', {}, '1 Idee') : h('span', {}, `${ids.length} Ideen`));

      h('button', { class: 'small', onclick: () => gotoIdeas(p.id, 'Geburtstag', thisYear()) }, '+ Idee'),
      h('button', { class: 'small', onclick: () => { tab = 'his'; render(); $('hper').value = p.id; render(); } }, 'Historie'),
      h('button', { class: 'small', onclick: () => startEditP(p) }, 'Bearbeiten'),
      h('button', { class: 'small', title: 'Löschen', 'aria-label': 'Löschen', onclick: () => { if (confirm(`„${p.name}“ löschen? Alle Geschenkideen dieser Person werden ebenfalls gelöscht.`)) { store.data.persons = store.data.persons.filter((x) => x !== p); store.data.ideas = store.data.ideas.filter((i) => i.person !== p.id); store.changed(); render(); } } }, '✕')),
      h('div', { class: 'meta' }, meta), p.note ? h('p', { class: 'note' }, p.note) : null);

}
function startEditP(p) { editP = p.id; $('pname').value = p.name; $('prel').value = p.rel; $('pbday').value = p.bday || ''; $('pbud').value = p.budget ? num2(p.budget) : ''; $('pnote').value = p.note || ''; tab = 'per'; render(); $('pname').focus(); }
function fillSelect(sel, opts, keep) {

}
function years() { const s = new Set([thisYear(), thisYear() + 1]); store.data.ideas.forEach((i) => s.add(i.year)); return [...s].sort((a, b) => b - a); }
function renderIdeas() {
  const d = store.data, pOpts = d.persons.slice().sort((a, b) => a.name.localeCompare(b.name)).map((p) => [p.id, p.name]);
  fillSelect($('iper'), pOpts);
  fillSelect($('iocc'), OCC.concat(d.occasions.map((o) => o.name)).filter((x, i, a) => a.indexOf(x) === i).map((o) => [o, o]));
  fillSelect($('istat'), STATUS.map((s) => [s, s]));
  fillSelect($('fper'), [['', 'Alle Personen']].concat(pOpts));
  fillSelect($('fyear'), [['', 'Alle Jahre']].concat(years().map((y) => [String(y), String(y)])), $('fyear').value || String(thisYear()));
  fillSelect($('fstat'), [['', 'Alle Status']].concat(STATUS.map((s) => [s, s])));
  $('isub').textContent = editI ? 'Übernehmen' : 'Hinzufügen'; $('icancel').hidden = !editI;
  const fp = $('fper').value, fy = $('fyear').value, fs = $('fstat').value;
  const list = d.ideas.filter((i) => (!fp || i.person === fp) && (!fy || String(i.year) === fy) && (!fs || i.status === fs)).sort((a, b) => b.year - a.year || STATUS.indexOf(a.status) - STATUS.indexOf(b.status));
  setKids($('ideaList'), (!d.persons.length ? [h('div', { class: 'card muted' }, 'Lege zuerst eine Person an, dann kannst du Geschenkideen sammeln.')] : list.length ? [h('div', { class: 'card' }, list.map(ideaRow))] : [h('div', { class: 'card muted' }, 'Keine Ideen für diese Auswahl.')]));
}
function linkOrText(s) { return /^https?:\/\//i.test(s) ? h('a', { href: s, target: '_blank', rel: 'noopener noreferrer' }, 'Link öffnen ↗') : s; }
function ideaRow(i) {
  const p = person(i.person), st = h('select', { 'aria-label': 'Status' }, STATUS.map((s) => h('option', { value: s, selected: s === i.status }, s)));
  st.onchange = () => { i.status = st.value; store.changed(); render(); };
  return h('div', { class: 'idea' }, h('div', { class: 'tx' }, h('b', {}, i.text), h('div', { class: 'meta' }, h('span', {}, p ? p.name : '?'), h('span', {}, i.occ), h('span', {}, String(i.year)), i.note ? h('span', {}, linkOrText(i.note)) : null)),
