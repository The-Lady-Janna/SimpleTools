<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raumplan</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  :root { --on-acc:#fff; }
  @media (prefers-color-scheme: dark) { :root { --on-acc:#0b1220; } }
  button.primary, .tool.on, .tabs button.on { color:var(--on-acc); }
  main.wide { max-width:none; }
  .layout { display:flex; gap:12px; align-items:flex-start; }
  .gridwrap { flex:1; min-width:0; overflow:auto; max-height:72vh; border:1px solid var(--line); border-radius:10px; background:var(--card); scroll-padding:28px 40px; outline:none; }
  .gridwrap:focus-visible { box-shadow:0 0 0 2px var(--accent); }
  .side { width:320px; flex:none; margin:0; }
  @media (max-width:900px) { .layout { flex-direction:column; align-items:stretch; } .side { width:100%; } }

  .grid { --cs:48px; display:grid; width:max-content; user-select:none; -webkit-user-select:none; }
  .h { position:sticky; background:var(--line); color:var(--muted); font-size:.75rem; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:2; border-right:1px solid var(--bg); border-bottom:1px solid var(--bg); }
  .h.col { top:0; } .h.row { left:0; } .h.corner { top:0; left:0; z-index:3; }
  .h.hl { background:color-mix(in srgb, var(--accent) 30%, var(--line)); color:var(--fg); }
  .cell { --sc:transparent; --fc:transparent; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; border-right:1px solid var(--line); border-bottom:1px solid var(--line); cursor:cell; }
  .cell.has { cursor:grab; }
  .cell.st { background:color-mix(in srgb, var(--sc) 35%, var(--card)); box-shadow:inset 0 0 0 3px var(--sc); }
  .cell.fill { background:var(--fc); }
  .cell.sel::after { content:''; position:absolute; inset:0; background:color-mix(in srgb, var(--accent) 22%, transparent); pointer-events:none; }
  .cell.act { outline:2px solid var(--accent); outline-offset:-2px; z-index:1; }
  .cell .ic { font-size:calc(var(--cs) * .5); line-height:1; max-width:100%; white-space:nowrap; pointer-events:none; }
  .cell img { width:calc(var(--cs) * .55); height:calc(var(--cs) * .55); object-fit:contain; pointer-events:none; }
  .cell .nm { font-size:max(9px, calc(var(--cs) * .2)); max-width:96%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.2; pointer-events:none; }
  .cell.fill .nm { color:#fff; text-shadow:0 0 2px #000; }
  .cell.fill.lt .nm { color:#111; text-shadow:0 0 2px #fff; }
  .grid.small .nm { display:none; }

  .tools { gap:6px; }
  .tool { display:inline-flex; align-items:center; gap:6px; }
  .tool.on { background:var(--accent); border-color:var(--accent); }
  .tool img { width:18px; height:18px; object-fit:contain; }
  .legend { display:flex; flex-wrap:wrap; gap:14px; font-size:.85rem; color:var(--muted); margin:6px 0; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; background:var(--sc); margin-right:5px; vertical-align:-1px; }

  .side h2 { font-size:1rem; margin:0 0 8px; display:flex; align-items:center; gap:8px; }
  .side h2 span { flex:1; }
  .side label.l, .cfg label.l { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
  .side input[type=text], .side input[type=number], .side input[type=date], .side textarea, .side select,
  .cfg input[type=text], .cfg input[type=number], .cfg select { width:100%; }
  .side textarea { min-height:72px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chipb { --sc:var(--line); display:inline-flex; align-items:center; gap:2px; border:2px solid var(--line); border-radius:99px; padding:1px 10px; cursor:pointer; background:var(--card); }
  .chipb.on { border-color:var(--sc); background:color-mix(in srgb, var(--sc) 25%, var(--card)); font-weight:600; }
  .hint { color:var(--muted); font-size:.85rem; }

  dialog { border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--fg); width:min(880px, 96vw); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog.small { width:min(520px, 96vw); }
  .tabs { display:flex; gap:6px; margin:8px 0; flex-wrap:wrap; }
  .tabs button.on { background:var(--accent); border-color:var(--accent); }
  .cfgrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; padding:6px 0; border-bottom:1px solid var(--line); }
  .cfgrow input[type=text] { flex:1; min-width:120px; width:auto; }
  .cfgrow input[type=color] { width:38px; height:32px; padding:0; border:1px solid var(--line); border-radius:6px; background:none; }
  .cfgrow input[type=color]:disabled { opacity:.35; cursor:not-allowed; }
  #i-err { color:var(--err); font-size:.9rem; margin:8px 0 0; }
  #i-err[hidden] { display:none; }
  .cfgrow select { width:auto; }
  .iconpick { width:44px; height:38px; display:inline-flex; align-items:center; justify-content:center; font-size:1.4rem; padding:0; }
  .iconpick img { width:28px; height:28px; object-fit:contain; }
  .emojis { display:flex; flex-wrap:wrap; gap:4px; max-height:260px; overflow:auto; }
  .emojis button { font-size:1.4rem; width:42px; height:42px; padding:0; }
  .small-btn { padding:2px 8px; }
  details.types { flex-basis:100%; color:var(--muted); font-size:.9rem; }
  details.types label { display:inline-block; margin-right:12px; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:8px 16px; border-radius:8px; z-index:50; }
  #toast[hidden] { display:none; }
  #roomname { width:200px; font-weight:600; }
</style>
</head>
<body>
<main class="wide">
  <p><a href="../index.html">← Alle Tools</a></p>
  <h1>Raumplan</h1>
  <div class="card toolbar">
    <button id="new">Neu</button>
    <button id="open">Öffnen…</button>
    <button id="save" class="primary">Speichern</button>
    <button id="saveas">Speichern unter…</button>
    <span style="flex:1"></span>
    <button id="undo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig">↶</button>
    <button id="redo" title="Wiederholen (Strg+Y)" aria-label="Wiederholen">↷</button>
    <button id="cfgbtn">⚙ Konfiguration</button>
  </div>
  <div id="status"></div>
  <div class="card toolbar tools">
    <input type="text" id="roomname" aria-label="Raumname" placeholder="Raumname">
    <span id="palette" class="toolbar tools"></span>
    <span style="flex:1"></span>
    <label>Zoom <input type="range" id="zoom" min="28" max="96" step="2"></label>
  </div>
  <div class="legend" id="legend"></div>
  <div class="layout">
    <div class="gridwrap" id="gridwrap" tabindex="0" aria-label="Raster"><div id="grid" class="grid"></div></div>
    <aside class="side card" id="side"></aside>
  </div>
  <p class="hint">Klick = auswählen · Ziehen = Bereich · Asset ziehen = verschieben (Strg = kopieren) · Entf = löschen · Strg+C/X/V · Pfeiltasten · Enter = Name bearbeiten · Typ in der Leiste wählen = Stempel (Esc beendet)</p>
</main>

<div id="toast" hidden></div>

<dialog id="dlg-cfg" class="cfg">
  <h2 style="margin-top:0">Konfiguration</h2>
  <div class="tabs" id="cfg-tabs"></div>
  <div id="cfg-body"></div>
  <div class="toolbar" style="margin-top:14px"><span style="flex:1"></span><button id="cfg-close" class="primary">Schließen</button></div>
</dialog>

<dialog id="dlg-icon" class="small">
  <h2 style="margin-top:0">Icon wählen</h2>
  <div class="emojis" id="emojis"></div>
  <label class="l" for="i-custom" style="display:block;margin-top:12px;color:var(--muted);font-size:.85rem">Eigenes Zeichen / Emoji (max. 4 Zeichen)</label>
  <div class="toolbar"><input type="text" id="i-custom" maxlength="40" style="flex:1"><button id="i-apply">Übernehmen</button></div>
  <label class="l" for="i-file" style="display:block;margin-top:12px;color:var(--muted);font-size:.85rem">Eigenes Bild (PNG, JPG, SVG …; wird auf 96×96 verkleinert)</label>
  <input type="file" id="i-file" accept="image/*">
  <p id="i-err" role="alert" hidden></p>
  <div class="toolbar" style="margin-top:14px"><button id="i-none">Kein Icon</button><span style="flex:1"></span><button id="i-cancel">Abbrechen</button></div>
</dialog>

<script src="../shared/storage.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const HEX = /^#[0-9a-f]{6}$/i;
const IMG = /^data:image\/(png|jpeg|gif|webp|svg\+xml);base64,[A-Za-z0-9+/=]+$/;
const MAXN = 100;
const FIELD_TYPES = { text: 'Text', textarea: 'Mehrzeilig', number: 'Zahl', date: 'Datum', select: 'Auswahl', checkbox: 'Ja/Nein' };
const EMOJIS = '🖥️ 💻 🖨️ 📠 ☎️ 📱 📷 📺 🔌 💡 🌐 📡 🗄️ 🗃️ 🪑 🛋️ 🛏️ 🚪 🪟 🚰 🚽 🚿 🧯 🔥 ❄️ 🌡️ 📦 🧰 🔧 🔒 🔑 🎤 🔊 📽️ 🖱️ ⌨️ 🧱 ⬛ 🟫 🪴 🗑️ 🍽️ ☕ 🛗 🪜 ⚠️ 🚨 🔋 📚 📋 🧪 🔬 ⚙️ 🏷️ ✅ ❌ ⭐ ➡️ ⬆️ ⬇️ ⬅️'.split(' ');

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function colName(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
const addr = (r, c) => colName(c) + (r + 1);
const key = (r, c) => r + ',' + c;
// Text-Icons nach sichtbaren Zeichen (Graphem-Cluster) zählen/kürzen, damit Emoji-Sequenzen (ZWJ) heil bleiben
let segmenter;
function graphemes(s) {
  s = String(s == null ? '' : s);
  try { if (!segmenter) segmenter = new Intl.Segmenter(undefined, { granularity: 'grapheme' }); return Array.from(segmenter.segment(s), (x) => x.segment); }
  catch (e) { return Array.from(s); }
}
const clipIcon = (s, n = 4) => Array.from(graphemes(s).slice(0, n).join('')).slice(0, 32).join('');
const isLight = (hex) => {
  if (!HEX.test(hex)) return false;
  const v = [1, 3, 5].map((i) => { const x = parseInt(hex.slice(i, i + 2), 16) / 255; return x <= .03928 ? x / 12.92 : Math.pow((x + .055) / 1.055, 2.4); });
  return .2126 * v[0] + .7152 * v[1] + .0722 * v[2] > .179;
};

/* ---------- Daten ---------- */
function makeDefaults() {
  const T = (name, icon, color, o) => Object.assign({ id: uid(), name, icon, color, fill: false, useStatus: true }, o);
  const wand = T('Wand', '', '#4b5563', { fill: true, useStatus: false });
  const tuer = T('Tür', '🚪', '#a16207', { useStatus: false });
  const fenster = T('Fenster', '🪟', '#38bdf8', { useStatus: false });
  const pc = T('Arbeitsplatz', '🖥️', '#6b7280');
  const drucker = T('Drucker', '🖨️', '#6b7280');
  const netz = T('Netzwerk', '🌐', '#6b7280');
  const schrank = T('Schrank', '🗄️', '#6b7280');
  const S = (name, color) => ({ id: uid(), name, color });
  const equip = [pc.id, drucker.id, netz.id, schrank.id];
  return {
    room: { name: 'Raum 1', cols: 20, rows: 14, zoom: 48 },
    types: [wand, tuer, fenster, pc, drucker, netz, schrank],
    statuses: [S('OK', '#22c55e'), S('Warnung', '#f59e0b'), S('Defekt', '#ef4444'), S('Geplant', '#3b82f6'), S('Inaktiv', '#9ca3af')],
    fields: [
      { id: uid(), label: 'Seriennummer', type: 'text', options: [], types: equip },
      { id: uid(), label: 'Verantwortlich', type: 'text', options: [], types: equip },
      { id: uid(), label: 'Notiz', type: 'textarea', options: [], types: [] },
    ],
    assets: [],
  };
}

const store = SimpleStorage.create({
  name: 'raumplan',
  defaults: makeDefaults,
  onChange: () => {
    const lost = normalize(store.data); resetHistory(); tool = { kind: 'select' }; render();
    if (lost) toast(`${lost} Asset(s) passten nicht in den Raum (max. ${MAXN}×${MAXN}) und wurden verworfen`);
  },
  statusEl: $('status'),
});
const D = () => store.data;

// Macht jede (auch handgeschriebene) Datei konsistent, ohne Assets zu verlieren.
function normalize(d) {
  const S = (v, def = '') => (typeof v === 'string' ? v : v == null ? def : String(v));
  const I = (v, def, lo, hi) => { v = parseInt(v, 10); if (!Number.isFinite(v)) v = def; return Math.min(hi, Math.max(lo, v)); };
  const objs = (a) => (Array.isArray(a) ? a : []).filter((x) => x && typeof x === 'object');
  const uniq = (set, id) => { id = S(id); if (!id || id === '__proto__' || set.has(id)) id = uid(); set.add(id); return id; };
  const room = d.room && typeof d.room === 'object' ? d.room : {};
  d.room = { name: S(room.name, 'Raum 1'), cols: I(room.cols, 20, 1, MAXN), rows: I(room.rows, 14, 1, MAXN), zoom: I(room.zoom, 48, 28, 96) };

  const tIds = new Set(), sIds = new Set(), fIds = new Set(), aIds = new Set();
  d.types = objs(d.types).map((t) => ({
    id: uniq(tIds, t.id), name: S(t.name, 'Typ'),
    icon: IMG.test(t.icon) ? t.icon : clipIcon(S(t.icon)),
    color: HEX.test(t.color) ? t.color : '#6b7280', fill: !!t.fill, useStatus: t.useStatus !== false,
  }));
  d.statuses = objs(d.statuses).map((s) => ({ id: uniq(sIds, s.id), name: S(s.name, 'Status'), color: HEX.test(s.color) ? s.color : '#9ca3af' }));
  d.fields = objs(d.fields).map((f) => ({
    id: uniq(fIds, f.id), label: S(f.label, 'Feld'), type: Object.hasOwn(FIELD_TYPES, f.type) ? f.type : 'text',
    options: (Array.isArray(f.options) ? f.options : []).map((o) => S(o)).filter(Boolean),
    types: [...new Set((Array.isArray(f.types) ? f.types : []).map((x) => S(x)).filter((x) => tIds.has(x)))],
  }));

  const raw = objs(d.assets), pending = [], assets = [], used = new Set();
  raw.forEach((a) => {
    let t = S(a.type);
    if (!tIds.has(t)) { // unbekannter Typ -> Platzhalter, damit nichts verloren geht
      if (!t) t = uid();
      tIds.add(t); d.types.push({ id: t, name: 'Unbekannt', icon: '❓', color: '#6b7280', fill: false, useStatus: true });
    }
    const type = d.types.find((x) => x.id === t);
    const vals = {};
    if (a.values && typeof a.values === 'object') for (const [k, v] of Object.entries(a.values)) if (k !== '__proto__' && ['string', 'number', 'boolean'].includes(typeof v)) vals[k] = v;
    const sv = S(a.status), st = sIds.has(sv) ? sv : null; // bei Typen ohne Status bleibt ein gültiger Status nur verborgen erhalten
    const asset = { id: uniq(aIds, a.id), type: t, status: st || (type.useStatus && d.statuses[0] ? d.statuses[0].id : null), name: S(a.name), row: parseInt(a.row, 10), col: parseInt(a.col, 10), values: vals };
    if (Number.isInteger(asset.row) && Number.isInteger(asset.col) && asset.row >= 0 && asset.col >= 0 && asset.row < MAXN && asset.col < MAXN) {
      d.room.rows = Math.max(d.room.rows, asset.row + 1); d.room.cols = Math.max(d.room.cols, asset.col + 1);
    }
    pending.push(asset);
  });
  // Erst alle gültigen, eindeutigen Positionen reservieren, dann den Rest auf freie Felder verteilen
  const rest = []; let dropped = 0;
  pending.forEach((a) => {
    const ok = Number.isInteger(a.row) && Number.isInteger(a.col) && a.row >= 0 && a.col >= 0 && a.row < MAXN && a.col < MAXN && !used.has(key(a.row, a.col));
    if (ok) { used.add(key(a.row, a.col)); assets.push(a); } else rest.push(a);
  });
  let cr = 0, cc = 0; // Suchposition (belegte Felder werden nie wieder frei)
  rest.forEach((a) => { // belegt oder ungültig -> erstes freies Feld, sonst Raum vergrößern
    let found = false;
    for (let r = cr; r < d.room.rows && !found; r++) for (let c = r === cr ? cc : 0; c < d.room.cols && !found; c++) if (!used.has(key(r, c))) { a.row = r; a.col = c; found = true; cr = r; cc = c; }
    if (!found) {
      if (d.room.rows < MAXN) { a.row = d.room.rows++; a.col = 0; found = true; }
      else if (d.room.cols < MAXN) { a.col = d.room.cols++; a.row = 0; found = true; cr = 0; cc = 0; }
    }
    if (!found) { dropped++; return; }
    used.add(key(a.row, a.col)); assets.push(a);
  });
  d.assets = assets;
  return dropped;
}

let typeById = new Map(), statusById = new Map(), byPos = new Map();
function rebuild() {
  const d = D();
  typeById = new Map(d.types.map((t) => [t.id, t]));
  statusById = new Map(d.statuses.map((s) => [s.id, s]));
  byPos = new Map(d.assets.map((a) => [key(a.row, a.col), a]));
}
const assetAt = (r, c) => byPos.get(key(r, c));
function addAsset(a) { D().assets.push(a); byPos.set(key(a.row, a.col), a); }
function removeAsset(a) { const L = D().assets; L.splice(L.indexOf(a), 1); byPos.delete(key(a.row, a.col)); }
function newAsset(typeId, r, c, extra) {
  const t = typeById.get(typeId), first = D().statuses[0];
  const a = Object.assign({ id: uid(), type: typeId, status: t.useStatus && first ? first.id : null, name: '', row: r, col: c, values: {} }, extra);
  addAsset(a); return a;
}

/* ---------- Rückgängig / Wiederholen ---------- */
let undoStack = [], redoStack = [], last = '';
// Der Zoom ist Ansichtseinstellung: nicht Teil der Schnappschüsse und bleibt bei Undo/Redo unverändert
const snap = () => { const d = D(); return JSON.stringify(Object.assign({}, d, { room: Object.assign({}, d.room, { zoom: 0 }) })); };
function resetHistory() { undoStack = []; redoStack = []; last = snap(); }
function flushPending() { // offene (noch nicht committete) Änderungen als eigenen Undo-Schritt sichern
  const now = snap();
  if (now !== last) { undoStack.push(last); if (undoStack.length > 100) undoStack.shift(); redoStack = []; last = now; }
}
function commit(opts) { flushPending(); store.changed(); render(opts); }
function restoreSnap(s) {
  const z = D().room.zoom, d = JSON.parse(s);
  if (d.room && typeof d.room === 'object') d.room.zoom = z;
  store.data = d; normalize(store.data); last = snap(); store.changed(); render();
}
function undo() { if (undoStack.length) { redoStack.push(last); restoreSnap(undoStack.pop()); } }
function redo() { if (redoStack.length) { undoStack.push(last); restoreSnap(redoStack.pop()); } }

/* ---------- Auswahl ---------- */
let anchor = { r: 0, c: 0 }, focus = { r: 0, c: 0 };
const rect = () => ({ r1: Math.min(anchor.r, focus.r), r2: Math.max(anchor.r, focus.r), c1: Math.min(anchor.c, focus.c), c2: Math.max(anchor.c, focus.c) });
const inRect = (r, c) => { const x = rect(); return r >= x.r1 && r <= x.r2 && c >= x.c1 && c <= x.c2; };
const isMulti = () => { const x = rect(); return x.r1 !== x.r2 || x.c1 !== x.c2; };
function assetsInRect() { const x = rect(); return D().assets.filter((a) => a.row >= x.r1 && a.row <= x.r2 && a.col >= x.c1 && a.col <= x.c2); }
function clampSel() {
  const R = D().room, cl = (p) => ({ r: Math.min(p.r, R.rows - 1), c: Math.min(p.c, R.cols - 1) });
  anchor = cl(anchor); focus = cl(focus);
}

/* ---------- Werkzeug ---------- */
let tool = { kind: 'select' };

/* ---------- Toast ---------- */
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800); }

/* ---------- Icons ---------- */
function iconEl(icon, size) {
  if (IMG.test(icon)) { const i = document.createElement('img'); i.src = icon; i.alt = ''; i.draggable = false; if (size) i.style.width = i.style.height = size + 'px'; return i; }
  const s = el('span', 'ic', icon); if (size) s.style.fontSize = size + 'px'; return s;
}

/* ---------- Rendering ---------- */
let cellEls = [], colHeads = [], rowHeads = [];
function render(opts) {
  rebuild(); clampSel();
  if (tool.kind === 'stamp' && !typeById.has(tool.type)) tool = { kind: 'select' };
  renderTools(); renderLegend(); renderGrid();
  if (!opts || !opts.keepPanel) renderSide();
  $('undo').disabled = !undoStack.length; $('redo').disabled = !redoStack.length;
}

// Die Palette wird nur neu gebaut, wenn sich die Typen ändern; sonst werden nur die Klassen umgeschaltet
// (so geht ein Klick nicht verloren, wenn gleichzeitig ein Eingabefeld seine Änderung committet).
let paletteSig = null;
function renderTools() {
  const R = D().room;
  if (document.activeElement !== $('roomname')) $('roomname').value = R.name;
  $('zoom').value = R.zoom;
  const p = $('palette'), sig = JSON.stringify(D().types.map((t) => [t.id, t.name, t.icon]));
  if (sig !== paletteSig || p.children.length !== D().types.length + 2) {
    paletteSig = sig; p.textContent = '';
    const mk = (k, kids, title, next) => {
      const b = el('button', 'tool'); b.type = 'button'; b.title = title; b.dataset.tk = k; b.append(...kids);
      b.onclick = (e) => { tool = next; if (e.detail) b.blur(); renderTools(); }; // Mausklick: Fokus zurück an die Seite, damit Esc/Pfeile wirken
      p.append(b);
    };

  const row = $('cfg-body').querySelectorAll('.cfgrow')[j], b = row && row.querySelector(`button[title="${dir < 0 ? 'Nach oben' : 'Nach unten'}"]`);
  if (b) b.focus(); // Fokus folgt der verschobenen Zeile (mehrfaches Verschieben per Tastatur)
}
function focusNewRow() { const rows = $('cfg-body').querySelectorAll('.cfgrow'), r = rows[rows.length - 1], i = r && r.querySelector('input[type=text]'); if (i) { i.focus(); i.select(); } }
function btn(text, title, fn, cls) { const b = el('button', cls || 'small-btn', text); b.type = 'button'; b.title = title; if (Array.from(text).length <= 1) b.setAttribute('aria-label', title); b.onclick = fn; return b; }
function textInput(value, ph, onInput) {
  const i = el('input'); i.type = 'text'; i.value = value; i.placeholder = ph; i.setAttribute('aria-label', ph);
  i.oninput = () => { onInput(i.value); store.changed(); };
  i.onchange = () => cfgCommit(false);
  return i;
}
function colorInput(value, onInput, label) {
  const i = el('input'); i.type = 'color'; i.value = value; i.setAttribute('aria-label', label || 'Farbe');
  i.oninput = () => { onInput(i.value); store.changed(); };
  i.onchange = () => cfgCommit(false);
  return i;
}
function checkbox(text, checked, onChange) {
  const l = el('label'); const i = el('input'); i.type = 'checkbox'; i.checked = checked; i.onchange = () => onChange(i.checked);
  l.append(i, ' ' + text); return l;
}

function renderCfg() {
  const tabs = $('cfg-tabs'), box = $('cfg-body'), FOC = 'button,input,select,summary', ae = document.activeElement;
  // Fokusposition merken, damit Tastaturbedienung nach dem Neuaufbau weitergeht
  const inTabs = !!ae && tabs.contains(ae), inBox = !!ae && box.contains(ae);
  const idx = inTabs ? Array.from(tabs.querySelectorAll('button')).indexOf(ae) : inBox ? Array.from(box.querySelectorAll(FOC)).indexOf(ae) : -1;
  tabs.textContent = '';
  TABS.forEach(([id, name]) => { const b = el('button', cfgTab === id ? 'on' : '', name); b.type = 'button'; b.onclick = () => { cfgTab = id; renderCfg(); }; tabs.append(b); });
  box.textContent = '';
  ({ types: cfgTypes, statuses: cfgStatuses, fields: cfgFields, room: cfgRoom })[cfgTab](box);
  if (idx >= 0) { const L = Array.from((inTabs ? tabs : box).querySelectorAll(inTabs ? 'button' : FOC)), n = L[Math.min(idx, L.length - 1)]; if (n) n.focus(); }
}

function cfgTypes(box) {
  const d = D();
  box.append(el('p', 'hint', 'Typen erscheinen als Stempel in der Leiste. „Status“ = das Asset hat einen farbigen Status. „Fläche füllen“ färbt die ganze Zelle (z. B. Wand) – nur dafür gilt die Farbe.'));
  d.types.forEach((t, i) => {
    const row = el('div', 'cfgrow');
    const ib = el('button', 'iconpick'); ib.type = 'button'; ib.title = 'Icon ändern'; ib.append(t.icon ? iconEl(t.icon) : document.createTextNode('＋')); ib.onclick = () => openIconPicker(t);
    const ci = colorInput(t.color, (v) => { t.color = v; }, 'Füllfarbe');
    ci.disabled = !t.fill; ci.title = t.fill ? 'Füllfarbe' : 'Füllfarbe – wirkt nur mit „Fläche füllen“';
    row.append(ib, textInput(t.name, 'Name', (v) => { t.name = v; }), ci,
      checkbox('Status', t.useStatus, (v) => { t.useStatus = v; d.assets.filter((a) => a.type === t.id).forEach((a) => setType(a, t.id)); cfgCommit(false); }),
      checkbox('Fläche füllen', t.fill, (v) => { t.fill = v; cfgCommit(true); }),
      btn('▲', 'Nach oben', () => moveIn(d.types, i, -1)), btn('▼', 'Nach unten', () => moveIn(d.types, i, 1)),
      btn('✕', 'Typ löschen', () => {
        const used = d.assets.filter((a) => a.type === t.id);
        // Felder, die nur für diesen Typ galten, würden sonst zu „gilt für alle Typen“ -> mitlöschen
        const orphan = d.fields.filter((f) => f.types.length && f.types.every((x) => x === t.id));
        const extra = orphan.length ? `${used.length ? ' und' : ' inkl.'} ${orphan.length} nur für diesen Typ geltende(s) Feld(er) mit allen Werten (${orphan.map((f) => '„' + f.label + '“').join(', ')})` : '';
        if (!confirm(`Typ „${t.name}“ löschen${used.length ? ` inkl. ${used.length} Asset(s)` : ''}${extra}?`)) return;
        used.forEach(removeAsset);
        orphan.forEach((f) => d.assets.forEach((a) => { delete a.values[f.id]; }));
        d.fields = d.fields.filter((f) => !orphan.includes(f));
        d.types.splice(i, 1); d.fields.forEach((f) => { f.types = f.types.filter((x) => x !== t.id); }); cfgCommit(true);
      }));
    box.append(row);
  });
  const add = btn('+ Typ', 'Neuen Typ anlegen', () => { d.types.push({ id: uid(), name: 'Neuer Typ', icon: '📦', color: '#6b7280', fill: false, useStatus: true }); cfgCommit(true); focusNewRow(); }, '');
  add.style.marginTop = '8px'; box.append(add);
}

function cfgStatuses(box) {
  const d = D();
  box.append(el('p', 'hint', 'Die Farbe wird in der Zelle angezeigt. Neue Assets bekommen den ersten Status der Liste.'));
  d.statuses.forEach((s, i) => {
    const row = el('div', 'cfgrow');
    row.append(colorInput(s.color, (v) => { s.color = v; }, 'Statusfarbe'), textInput(s.name, 'Name', (v) => { s.name = v; }),
      btn('▲', 'Nach oben', () => moveIn(d.statuses, i, -1)), btn('▼', 'Nach unten', () => moveIn(d.statuses, i, 1)),
      btn('✕', 'Status löschen', () => {
        const used = d.assets.filter((a) => a.status === s.id);
        const vis = used.filter((a) => { const t = typeById.get(a.type); return t && t.useStatus; }).length;
        if (!confirm(`Status „${s.name}“ löschen${vis ? `? ${vis} Asset(s) ${d.statuses.length === 1 ? 'haben danach keinen Status' : 'bekommen den ersten verbleibenden Status'}` : '?'}`)) return;
        d.statuses.splice(i, 1);
        used.forEach((a) => { a.status = d.statuses[0] ? d.statuses[0].id : null; });
        cfgCommit(true);
      }));
    box.append(row);
  });
  const add = btn('+ Status', 'Neuen Status anlegen', () => {
    const ns = { id: uid(), name: 'Neuer Status', color: '#a855f7' }, valid = new Set(d.statuses.map((x) => x.id));
    d.statuses.push(ns);
    // Assets von Typen mit Status, die (z. B. nach Löschen aller Status) keinen gültigen Status haben, bekommen den neuen
    d.assets.forEach((a) => { const t = typeById.get(a.type); if (t && t.useStatus && !valid.has(a.status)) a.status = ns.id; });
    cfgCommit(true); focusNewRow();
  }, '');
  add.style.marginTop = '8px'; box.append(add);
}

function cfgFields(box) {
  const d = D();
  box.append(el('p', 'hint', 'Felder, die jedes Asset zusätzlich zum Namen hat. Optional auf bestimmte Typen beschränkbar.'));
  d.fields.forEach((f, i) => {
    const row = el('div', 'cfgrow');
    const ts = el('select'); ts.setAttribute('aria-label', 'Feldtyp'); Object.entries(FIELD_TYPES).forEach(([k, v]) => ts.append(new Option(v, k))); ts.value = f.type;
    ts.onchange = () => { f.type = ts.value; cfgCommit(true); };
    row.append(textInput(f.label, 'Bezeichnung', (v) => { f.label = v; }), ts);
    if (f.type === 'select') {
      const o = textInput(f.options.join(', '), 'Optionen, kommagetrennt', (v) => { f.options = v.split(',').map((x) => x.trim()).filter(Boolean); });
      row.append(o);
    }
    row.append(btn('▲', 'Nach oben', () => moveIn(d.fields, i, -1)), btn('▼', 'Nach unten', () => moveIn(d.fields, i, 1)),
      btn('✕', 'Feld löschen', () => {
        if (!confirm(`Feld „${f.label}“ löschen? Die eingetragenen Werte gehen verloren.`)) return;
        d.assets.forEach((a) => { delete a.values[f.id]; }); d.fields.splice(i, 1); cfgCommit(true);
      }));
    const det = el('details', 'types');
    const sum = el('summary', null, f.types.length ? `Gilt für: ${f.types.map((id) => (typeById.get(id) || {}).name).filter(Boolean).join(', ')}` : 'Gilt für: alle Typen');
    det.append(sum);
    d.types.forEach((t) => det.append(checkbox(t.name, f.types.includes(t.id), (v) => {
      f.types = v ? [...f.types, t.id] : f.types.filter((x) => x !== t.id); cfgCommit(false);
      sum.textContent = f.types.length ? `Gilt für: ${f.types.map((id) => (typeById.get(id) || {}).name).filter(Boolean).join(', ')}` : 'Gilt für: alle Typen';
    })));
    det.append(el('div', 'hint', 'Nichts angehakt = gilt für alle Typen.'));
    row.append(det); box.append(row);
  });
  const add = btn('+ Feld', 'Neues Feld anlegen', () => { d.fields.push({ id: uid(), label: 'Neues Feld', type: 'text', options: [], types: [] }); cfgCommit(true); focusNewRow(); }, '');
  add.style.marginTop = '8px'; box.append(add);
}

function cfgRoom(box) {
  const R = D().room;
  box.append(el('p', 'hint', `Raumgröße in Zellen (1–${MAXN}). Spalten = A, B, C …, Zeilen = 1, 2, 3 …`));
  const row = el('div', 'cfgrow');
  const mk = (label, val) => { const l = el('label', null, label + ' '); const i = el('input'); i.type = 'number'; i.min = 1; i.max = MAXN; i.value = val; i.style.width = '90px'; l.append(i); return [l, i]; };
  const [lc, ic] = mk('Spalten', R.cols), [lr, ir] = mk('Zeilen', R.rows);
  const apply = () => {
    const cols = Math.min(MAXN, Math.max(1, parseInt(ic.value, 10) || R.cols)), rows = Math.min(MAXN, Math.max(1, parseInt(ir.value, 10) || R.rows));
    const lost = D().assets.filter((a) => a.col >= cols || a.row >= rows);
    if (lost.length && !confirm(`${lost.length} Asset(s) liegen außerhalb des neuen Raums und werden gelöscht. Fortfahren?`)) { renderCfg(); return; }
    lost.forEach(removeAsset); R.cols = cols; R.rows = rows; cfgCommit(true);
  };
  ic.onchange = apply; ir.onchange = apply;
  row.append(lc, lr); box.append(row);
}

// Icon-Auswahl
let iconTarget = null;
function openIconPicker(t) {
  iconTarget = t; const g = $('emojis'); g.textContent = '';
  EMOJIS.forEach((e) => { const b = el('button', null, e); b.type = 'button'; b.onclick = () => setIcon(e); g.append(b); });
  $('i-custom').value = IMG.test(t.icon) ? '' : t.icon;
  $('i-err').hidden = true; $('i-err').textContent = '';
  $('dlg-icon').showModal();
}
function setIcon(v) { iconTarget.icon = v; $('dlg-icon').close(); cfgCommit(true); }
$('i-apply').onclick = () => {
  const raw = $('i-custom').value.trim(), v = clipIcon(raw);
  setIcon(v); if (v !== raw) toast('Icon auf 4 Zeichen gekürzt');
};
$('i-none').onclick = () => setIcon('');
$('i-cancel').onclick = () => $('dlg-icon').close();
function fileToIcon(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Datei konnte nicht gelesen werden'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('Bild konnte nicht gelesen werden'));
      img.onload = () => {
        const S = 96, cv = document.createElement('canvas'); cv.width = cv.height = S;
        const iw = img.naturalWidth || S, ih = img.naturalHeight || S, k = Math.min(S / iw, S / ih), w = iw * k, h = ih * k;
        cv.getContext('2d').drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
        res(cv.toDataURL('image/png'));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
$('i-file').onchange = async (e) => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  $('i-err').hidden = true;
  try { setIcon(await fileToIcon(f)); } catch (err) { $('i-err').textContent = err.message; $('i-err').hidden = false; } // im Dialog anzeigen: ein Toast läge hinter dem modalen Dialog
};
$('cfgbtn').onclick = () => { renderCfg(); $('dlg-cfg').showModal(); };
$('cfg-close').onclick = () => $('dlg-cfg').close();

/* ---------- Toolbar ---------- */
$('roomname').oninput = (e) => { D().room.name = e.target.value; store.changed(); };
$('roomname').onchange = () => commit({ keepPanel: true });
$('zoom').oninput = (e) => { D().room.zoom = +e.target.value; store.changed(); renderGrid(); };
$('undo').onclick = undo; $('redo').onclick = redo;
$('new').onclick = () => store.new();
$('open').onclick = () => store.open();
$('save').onclick = () => store.save();
$('saveas').onclick = () => store.saveAs();

normalize(D()); resetHistory(); render();
store.restore();
</script>
