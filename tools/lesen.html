<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesetagebuch</title>
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/i18n.js"></script>

<style>

  .stars button.on { color:var(--warn); } .stars.ro { color:var(--warn); letter-spacing:1px; white-space:nowrap; }
  .det { margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
  .grid label.f input, .grid label.f select { width:100%; box-sizing:border-box; }
  .q { border-left:3px solid var(--accent); padding:4px 10px; margin:8px 0; display:flex; gap:8px; align-items:flex-start; }
  .q .t { flex:1; overflow-wrap:anywhere; white-space:pre-wrap; } .q .t.zitat { font-style:italic; }
  .hint { color:var(--muted); font-size:.82rem; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin:8px 0; }
  .kpi { border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--bg); } .kpi b { display:block; font-size:1.35rem; } .kpi span { color:var(--muted); font-size:.8rem; }
  .hb { display:grid; grid-template-columns:minmax(70px,9em) 1fr 3em; gap:8px; align-items:center; margin:4px 0; font-size:.9rem; }
  .hb .lbl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .hb .bar { margin:0; } .hb .n { text-align:right; color:var(--muted); }
  svg.chart { width:100%; height:auto; display:block; } svg.chart text { fill:var(--muted); font-size:11px; }
  .day { font-weight:600; margin-top:10px; display:flex; justify-content:space-between; gap:8px; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; } .filters input[type=search] { flex:1; min-width:160px; }
  .filters select { min-width:0; max-width:100%; }
  textarea { box-sizing:border-box; }

</style>
</head>
<body>
<main>
  <p><a href="../index.html">← Alle Tools</a></p>
  <h1>Lesetagebuch</h1>
  <div class="card toolbar">
    <button id="new">Neu</button>
    <button id="open">Öffnen…</button>
    <button id="save" class="primary">Speichern</button>
    <button id="saveas">Speichern unter…</button>
  </div>
  <div id="status"></div>

  <div class="tabs"><button data-tab="books">Bücher</button><button data-tab="read">Lesen</button><button data-tab="goal">Jahresziel</button><button data-tab="stats">Statistik</button></div>
  <div id="view"></div>

</main>
<script src="../shared/storage.js"></script>
<script>

const bookById = (id) => store.data.books.find((b) => b.id === id);

}

  return h('div', { class: 'det' }, grid, rate, h('h3', { style: 'margin:10px 0 0;font-size:1rem' }, '💬 Zitate & Notizen'), list, qf, h('div', { class: 'row', style: 'margin-top:10px' }, b.quotes.length ? cp : null, h('span', { class: 'sp' }), del));
}
function booksView() {
