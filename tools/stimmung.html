function renderStats() {
  const es = stats(), withMood = es.filter(([, d]) => d.mood), ms = withMood.map(([, d]) => d.mood);
  const sel2 = h('select', { 'aria-label': 'Zeitraum', onchange: (e) => { range = e.target.value; render(); } }, [['30', 'Letzte 30 Tage'], ['90', 'Letzte 90 Tage'], ['365', 'Letztes Jahr'], ['all', 'Alle Einträge']].map(([v, l]) => h('option', { value: v, selected: v === range }, l)));
  const sc = (label, big, sub) => h('div', { class: 'card' }, h('span', { class: 'muted' }, label), h('b', {}, big), h('span', { class: 'muted', style: 'font-size:.8rem' }, sub || ''));
  const en = es.filter(([, d]) => d.energy).map(([, d]) => d.energy), st = es.filter(([, d]) => d.stress).map(([, d]) => d.stress);
  const nG = es.reduce((s, [, d]) => s + d.grat.filter((g) => g.trim()).length, 0);
  let streak = 0; { let k = days()[T0()] && !isEmpty(days()[T0()]) ? T0() : addDays(T0(), -1); while (days()[k] && !isEmpty(days()[k])) { streak++; k = addDays(k, -1); } }
  const top = {}; es.forEach(([, d]) => d.tags.forEach((t) => { (top[t] = top[t] || []).push(d.mood); }));
  const overall = avg(ms);
  const rows = Object.entries(top).map(([t, a]) => { const mm = a.filter(Boolean); return { t, n: a.length, avg: mm.length ? avg(mm) : null, nm: mm.length }; }).sort((a, b) => b.n - a.n || a.t.localeCompare(b.t, 'de'));
  const maxN = rows.length ? rows[0].n : 1;
  const tagRows = rows.slice(0, 12).map((r) => {
    const dlt = r.avg != null && r.nm >= 3 ? r.avg - overall : null;
    return h('div', { class: 'trow' }, h('span', {}, r.t), h('span', { class: 'muted' }, r.n + '×'), h('div', { class: 'bar', title: r.avg != null ? 'Ø Stimmung ' + fmt1(r.avg) : '' }, h('i', { style: 'width:' + (r.n / maxN * 100) + '%;background:' + (r.avg != null ? 'var(--m' + Math.min(5, Math.max(1, Math.round(r.avg))) + ')' : 'var(--line)') })),
      h('span', { class: 'd ' + (dlt == null ? 'muted' : dlt > 0.05 ? 'pos' : dlt < -0.05 ? 'neg' : 'muted') }, dlt == null ? '–' : fmtS(dlt)));
  });
  $('v-stats').replaceChildren(
    h('div', { class: 'card row' }, h('strong', { class: 'sp' }, 'Zeitraum'), sel2),
    h('div', { class: 'sum' }, sc('Ø Stimmung', ms.length ? fmt1(overall) + ' / 5' : '–', ms.length ? ms.length + ' Tage' : ''), sc('Ø Energie', en.length ? fmt1(avg(en)) + ' / 5' : '–'), sc('Ø Stress', st.length ? fmt1(avg(st)) + ' / 5' : '–'), sc('Dankbarkeits-Einträge', String(nG)), sc('Tage in Folge', String(streak))),
    h('div', { class: 'card' }, h('strong', {}, 'Stimmungsverteilung'), MOODS.map((m, i) => { const c = ms.filter((x) => x === i + 1).length; return h('div', { class: 'trow', style: 'grid-template-columns:10em 3.5em 1fr' }, h('span', {}, m[0] + ' ' + m[1]), h('span', { class: 'muted' }, c + '×'), h('div', { class: 'bar' }, h('i', { style: 'width:' + (ms.length ? c / ms.length * 100 : 0) + '%;background:var(--m' + (i + 1) + ')' }))); })),
    h('div', { class: 'card' }, h('strong', {}, 'Häufigste Tags und ihr Zusammenhang mit der Stimmung'),
      rows.length ? [h('div', { class: 'trow head' }, h('span', {}, 'Tag'), h('span', {}, 'Tage'), h('span', {}, 'Ø Stimmung'), h('span', { class: 'd' }, 'Abweichung')), tagRows,
        h('p', { class: 'muted', style: 'font-size:.85rem' }, 'Abweichung = Ø Stimmung an Tagen mit diesem Tag minus Gesamt-Ø (erst ab 3 Tagen mit Stimmung). Das ist nur eine Auffälligkeit in deinen Daten, kein Beweis für Ursache und Wirkung.')]
        : h('p', { class: 'muted' }, 'Noch keine Tags im Zeitraum. Wähle beim Eintrag ein paar Tags, dann siehst du hier Zusammenhänge.')));
}

/* ---------- Rückblick ---------- */
function renderBack() {
  const t0 = T0(), cand = Object.entries(days()).filter(([, d]) => d.grat.some((g) => g.trim())).map(([k]) => k);
  const old = cand.filter((k) => k < t0);
  const pool = old.length ? old : cand;
  if (!backKey || !pool.includes(backKey)) backKey = pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
  if (!backKey) { $('v-back').replaceChildren(h('div', { class: 'card muted' }, 'Noch keine Dankbarkeits-Einträge. Trage beim Tageseintrag bis zu drei Dinge ein – hier siehst du später zufällige Erinnerungen daran.')); return; }
  const d = days()[backKey], ago = diffDays(backKey, t0);
  const when = ago === 0 ? 'Heute' : ago === 1 ? 'Gestern' : ago > 1 ? 'Vor ' + ago + ' Tagen' : 'In ' + (-ago) + ' Tagen';
  const next = () => { const o = pool.filter((k) => k !== backKey); if (o.length) backKey = o[Math.floor(Math.random() * o.length)]; render(); };
  $('v-back').replaceChildren(h('div', { class: 'card' }, h('div', { class: 'row' }, h('strong', { class: 'sp' }, '🙏 Erinnerung'), h('span', { class: 'badge' }, when), d.mood ? h('span', { title: MOODS[d.mood - 1][1] }, MOODS[d.mood - 1][0]) : null),
    h('p', { class: 'muted', style: 'margin:4px 0' }, longDate(backKey)),
    h('ul', { class: 'quote' }, d.grat.filter((g) => g.trim()).map((g) => h('li', {}, g))),
    d.note.trim() ? h('p', { class: 'muted', style: 'white-space:pre-wrap' }, d.note) : null,
    h('div', { class: 'row' }, h('button', { type: 'button', class: 'primary', onclick: next, disabled: pool.length < 2 }, 'Anderer Eintrag'), h('button', { type: 'button', onclick: () => openDay(backKey) }, 'Tag öffnen')),
    pool.length < 2 ? h('p', { class: 'muted', style: 'font-size:.85rem' }, 'Es gibt erst einen Dankbarkeits-Eintrag.') : null));
}

{ // Neuzeichnen darf sich nicht selbst unterbrechen (Blur/Change-Ereignisse beim Ersetzen von Elementen)
  const inner = render; let busy = false, again = false;
  render = function () {
    if (busy) { again = true; return; }
    busy = true; try { inner(); } finally { busy = false; }
    if (again) { again = false; render(); }
  };
}
store.restore();
normalize();
render();
</script>
