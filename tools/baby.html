const METRICS = { meals: ['Mahlzeiten', (s) => s.meals], ml: ['Fläschchen (ml)', (s) => s.ml], sleep: ['Schlaf (Std.)', (s) => s.sleep / 60], diapers: ['Windeln', (s) => s.diapers], weight: ['Gewicht (kg)', (s) => s.weight], fever: ['Temperatur (°C)', (s) => s.fever] };
